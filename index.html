<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IAmBoard.lol</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe14d;--ink:#111;--edge:#111;--sub:#3a3200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171538;--ink:#fff6d6;--edge:#000;--sub:#c9c4f5}}
:root[data-theme="dark"]{--bg:#171538;--ink:#fff6d6;--edge:#000;--sub:#c9c4f5}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bungee{font-family:Bungee,'Arial Black',Impact,system-ui,sans-serif}
#home{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0;font-size:clamp(2.6rem,11vw,6rem);line-height:.95;letter-spacing:.01em;font-weight:400;display:flex;flex-wrap:wrap}
h1 span{display:inline-block;animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-120px) rotate(-25deg);opacity:0}}
.tag{font-size:clamp(1.05rem,3.2vw,1.4rem);margin:14px 0 20px;color:var(--sub);font-weight:600}
#rnd{font:inherit;font-weight:800;font-size:1.15rem;color:#111;background:#ff5d8f;border:3px solid #111;border-radius:14px;padding:12px 22px;cursor:pointer;box-shadow:5px 5px 0 var(--edge)}
#rnd:active,.card:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--edge)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:34px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border:3px solid #111;border-radius:18px;color:#111;box-shadow:6px 6px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.card:nth-child(odd){transform:rotate(-1deg)}
.card:nth-child(even){transform:rotate(1deg)}
.card:hover{transform:rotate(0) translate(-2px,-3px);box-shadow:9px 10px 0 var(--edge)}
.card:focus-visible,#rnd:focus-visible,.bar button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.card .e{font-size:2.8rem;line-height:1}
.card h2{margin:4px 0 0;font-size:1.35rem;font-weight:400}
.card p{margin:0;font-size:.98rem;line-height:1.35;font-weight:500}
.card .t{align-self:flex-start;margin-top:6px;font-size:.78rem;font-weight:800;background:#111;color:#fff;border-radius:999px;padding:2px 10px}
footer{margin-top:44px;font-size:.95rem;color:var(--sub)}
#player{position:fixed;inset:0;display:none;flex-direction:column;background:#000;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#player.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-bottom:3px solid #111}
.bar b{flex:1;font-size:1.05rem;font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{font:inherit;font-weight:800;color:#111;background:#fff;border:3px solid #111;border-radius:10px;padding:5px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
iframe{flex:1;border:0;width:100%;background:#000}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}.card{transition:none}}
</style>
</head>
<body>
<main id="home">
  <h1 class="bungee" id="logo" aria-label="IAmBoard.lol"></h1>
  <p class="tag">Nine games. Zero homework. Pick one and get un-bored.</p>
  <button id="rnd">I'm bored. Surprise me!</button>
  <div id="grid"></div>
  <footer>Progress and high scores save in this browser.</footer>
</main>

<script>
const GAMES=[{"id": "doodle-jam", "e": "🎶", "t": "Doodle Jam", "d": "Draw glowing strings, drop balls on them, and make music.", "tag": "Creative", "c": "#5ef2e0", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Doodle Jam<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#1d1330;--ink:#fff3e0;--pill:#3a2660;--hot:#ff6fb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1d1330}}\n:root[data-theme=\"dark\"]{--bg:#1d1330}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;display:flex;flex-direction:column}\nheader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex-wrap:wrap}\nh1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:.01em}\n.bar{display:flex;gap:8px}\nbutton{font:inherit;font-weight:500;color:var(--ink);background:var(--pill);border:2px solid transparent;border-radius:999px;padding:8px 16px;cursor:pointer}\nbutton:hover{border-color:var(--hot)}\nbutton:focus-visible{outline:3px solid #ffd166;outline-offset:2px}\nbutton[aria-pressed=\"true\"]{background:var(--hot);color:#2a0f3d}\nmain{position:relative;flex:1;min-height:0}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}\n#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.3rem;line-height:1.5;pointer-events:none;opacity:.8}\n#hint.gone{display:none}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Doodle Jam<\/h1>\n  <div class=\"bar\">\n    <button id=\"rain\" aria-pressed=\"false\">Rain balls<\/button>\n    <button id=\"undo\">Undo<\/button>\n    <button id=\"clear\">Clear<\/button>\n  <\/div>\n<\/header>\n<main>\n  <canvas id=\"c\" aria-label=\"Drawing area: drag to draw strings, tap to drop balls\"><\/canvas>\n  <div id=\"hint\">Drag to draw a bouncy string.<br>Tap to drop a ball onto it.<br>Short strings sing high, long ones sing low.<\/div>\n<\/main>\n<\script>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d'),hint=document.getElementById('hint');\nlet W=0,H=0;\nfunction fit(){const d=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#1d1330';ctx.fillRect(0,0,W,H)}\naddEventListener('resize',fit);fit();\n\nconst lines=[],balls=[],rings=[];\nlet drawing=null,ac=null,rainTimer=null;\nconst penta=[0,2,4,7,9];\nconst freq=d=>261.63*Math.pow(2,(penta[d%5]+12*Math.floor(d/5))/12);\nfunction note(d,v){\n  if(!ac)return;\n  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();\n  o.type='triangle';o.frequency.value=freq(d);\n  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.7);\n  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.75);\n}\nfunction wake(){\n  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}\n}\nfunction addBall(x,y){\n  if(balls.length>80)balls.shift();\n  balls.push({x,y,vx:(Math.random()-.5)*60,vy:0,r:9,hue:Math.floor(Math.random()*360)});\n}\n\ncv.addEventListener('pointerdown',e=>{\n  wake();cv.setPointerCapture(e.pointerId);\n  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n  drawing={x1:x,y1:y,x2:x,y2:y,moved:false};\n});\ncv.addEventListener('pointermove',e=>{\n  if(!drawing)return;\n  const r=cv.getBoundingClientRect();\n  drawing.x2=e.clientX-r.left;drawing.y2=e.clientY-r.top;\n  if(Math.hypot(drawing.x2-drawing.x1,drawing.y2-drawing.y1)>14)drawing.moved=true;\n});\nfunction release(){\n  if(!drawing)return;\n  const l=drawing;drawing=null;\n  const len=Math.hypot(l.x2-l.x1,l.y2-l.y1);\n  if(l.moved&&len>30){\n    const d=Math.max(0,Math.min(14,14-Math.floor((len-40)/30)));\n    lines.push({x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,d,hue:Math.round(d/14*300),glow:0});\n    hint.classList.add('gone');\n    note(d,.12);\n  }else addBall(l.x1,l.y1);\n}\ncv.addEventListener('pointerup',release);\ncv.addEventListener('pointercancel',()=>{drawing=null});\n\nconst rainBtn=document.getElementById('rain');\nrainBtn.onclick=()=>{\n  wake();\n  const on=rainBtn.getAttribute('aria-pressed')!=='true';\n  rainBtn.setAttribute('aria-pressed',on);\n  clearInterval(rainTimer);\n  if(on)rainTimer=setInterval(()=>addBall(Math.random()*W,-10),500);\n};\ndocument.getElementById('undo').onclick=()=>{lines.pop()};\ndocument.getElementById('clear').onclick=()=>{lines.length=0;balls.length=0;hint.classList.remove('gone')};\n\nfunction step(dt){\n  for(let i=balls.length-1;i>=0;i--){\n    const b=balls[i];\n    b.vy+=900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;\n    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.9}\n    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.9}\n    if(b.y>H+60){balls.splice(i,1);continue}\n    for(const l of lines){\n      const dx=l.x2-l.x1,dy=l.y2-l.y1,L2=dx*dx+dy*dy||1;\n      let t=((b.x-l.x1)*dx+(b.y-l.y1)*dy)/L2;t=Math.max(0,Math.min(1,t));\n      const px=l.x1+t*dx,py=l.y1+t*dy;\n      let nx=b.x-px,ny=b.y-py,d=Math.hypot(nx,ny);\n      if(d<b.r){\n        if(d<1e-3){nx=-dy;ny=dx;d=Math.hypot(nx,ny)||1}\n        nx/=d;ny/=d;\n        b.x=px+nx*b.r;b.y=py+ny*b.r;\n        const vn=b.vx*nx+b.vy*ny;\n        if(vn<0){\n          b.vx-=1.88*vn*nx;b.vy-=1.88*vn*ny;\n          if(-vn>70){\n            note(l.d,Math.min(.3,.04-vn/2200));\n            l.glow=1;rings.push({x:px,y:py,r:b.r,a:1,hue:l.hue});\n          }\n        }\n      }\n    }\n  }\n}\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.033,(now-last)/1000);last=now;\n  step(dt/2);step(dt/2);\n  ctx.fillStyle='rgba(29,19,48,.3)';ctx.fillRect(0,0,W,H);\n  ctx.lineCap='round';\n  for(const l of lines){\n    l.glow*=.92;\n    ctx.shadowColor=`hsl(${l.hue} 100% 65%)`;ctx.shadowBlur=l.glow*24;\n    ctx.strokeStyle=`hsl(${l.hue} 90% ${62+l.glow*20}%)`;ctx.lineWidth=6+l.glow*6;\n    ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();\n  }\n  ctx.shadowBlur=0;\n  if(drawing&&drawing.moved){\n    ctx.setLineDash([8,10]);ctx.strokeStyle='#fff3e0';ctx.lineWidth=3;\n    ctx.beginPath();ctx.moveTo(drawing.x1,drawing.y1);ctx.lineTo(drawing.x2,drawing.y2);ctx.stroke();\n    ctx.setLineDash([]);\n  }\n  for(let i=rings.length-1;i>=0;i--){\n    const g=rings[i];g.r+=2.2;g.a-=.045;\n    if(g.a<=0){rings.splice(i,1);continue}\n    ctx.strokeStyle=`hsl(${g.hue} 100% 75% / ${g.a})`;ctx.lineWidth=3;\n    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,6.283);ctx.stroke();\n  }\n  for(const b of balls){\n    ctx.fillStyle=`hsl(${b.hue} 95% 68%)`;\n    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();\n  }\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "snack-stack", "e": "🥞", "t": "Snack Stack", "d": "Drop swinging snacks into a wobbly tower without toppling it.", "tag": "Arcade", "c": "#ffa94d", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Snack Stack<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#0b3c49;--ink:#fff8e7;--hot:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0b3c49}}\n:root[data-theme=\"dark\"]{--bg:#0b3c49}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}\n.disp{font-family:'Bagel Fat One','Arial Rounded MT Bold','Arial Black',system-ui,sans-serif}\n#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none}\n#score{font-size:3.2rem;line-height:1}\n#best{font-size:1rem;opacity:.75;text-align:right}\n#quip{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 82px);text-align:center;font-size:1.15rem;pointer-events:none;padding:0 16px}\n#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,38,.72)}\n#over.show{display:flex}\n#panel{text-align:center;padding:28px 34px;background:#ef476f;color:#fff8e7;border-radius:28px;max-width:85vw}\n#panel h2{margin:0 0 6px;font-size:2.4rem;font-weight:400}\n#panel p{margin:4px 0 18px;font-size:1.1rem}\nbutton{font:inherit;font-size:1.25rem;color:#3b0d1c;background:var(--hot);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}\nbutton:focus-visible{outline:3px solid #fff8e7;outline-offset:3px}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Tap or press space to drop the snack\"><\/canvas>\n<div id=\"hud\"><div id=\"score\" class=\"disp\">0<\/div><div id=\"best\">Best 0<\/div><\/div>\n<div id=\"quip\" class=\"disp\">Tap to drop the snack<\/div>\n<div id=\"over\"><div id=\"panel\"><h2 class=\"disp\">Splat!<\/h2><p id=\"res\"><\/p><button id=\"again\">Stack again<\/button><\/div><\/div>\n<\script>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nconst $=id=>document.getElementById(id);\nconst H0=28;\nlet W=0,H=0,gY=0;\nfunction fit(){const d=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);gY=H-70}\naddEventListener('resize',fit);fit();\n\nconst items=[['Pancake','#f4a259'],['Cheese','#ffd23f'],['Tomato','#ef476f'],['Lettuce','#7bd389'],['Bun','#e9a15b'],['Bacon','#e5707e'],['Pickle','#8bb174'],['Waffle','#ffbe6f'],['Toast','#f2cc8f'],['Berries','#9a9ce0']];\nconst quips=['Sturdy.','Bold choice.','Load-bearing pickle.','Gravity is thinking about it.','Structural engineers hate this.','Snack architecture at its finest.'];\nlet best=0;try{best=+localStorage.getItem('snackBest')||0}catch(e){}\n$('best').textContent='Best '+best;\n\nlet stack,cur,debris,pops,score,state,t=0,cam=0,danger=0,overTimer=0,ac=null;\n\nfunction beep(f,d,type){\n  if(!ac)return;\n  const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();\n  o.type=type||'sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f/2,n+d);\n  g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);\n  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02);\n}\nfunction wake(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}\n\nfunction spawn(){\n  const it=items[Math.floor(Math.random()*items.length)];\n  cur={w:Math.min(W*.5,70+Math.random()*90),c:it[1],n:it[0],x:W/2,y:0,vy:0};\n  state='play';\n}\nfunction newGame(){\n  stack=[{x:W/2,w:Math.min(240,W*.6),c:'#b8c4cc',n:'Plate'}];\n  debris=[];pops=[];score=0;cam=0;danger=0;\n  $('score').textContent='0';$('over').classList.remove('show');$('quip').textContent='Tap to drop the snack';\n  spawn();\n}\nfunction say(s){$('quip').textContent=s}\nfunction pop(text,x,y){pops.push({text,x,y,a:1})}\n\nfunction endGame(){\n  state='over';overTimer=.9;\n}\nfunction showOver(){\n  if(score>best){best=score;try{localStorage.setItem('snackBest',best)}catch(e){}}\n  $('best').textContent='Best '+best;\n  $('res').textContent='Your tower was '+score+' snacks high.';\n  $('over').classList.add('show');$('again').focus();\n}\n\nfunction drop(){\n  wake();\n  if(state!=='play')return;\n  state='fall';cur.y=90-cam;cur.vy=0;\n}\n\nfunction checkStability(){\n  let sumW=0,sumWX=0,fail=-1,minM=1;\n  for(let j=stack.length-1;j>=1;j--){\n    const p=stack[j],s=stack[j-1];\n    sumW+=p.w;sumWX+=p.w*p.x;\n    const com=sumWX/sumW,m=(s.w/2-Math.abs(com-s.x))/(s.w/2);\n    if(m<0)fail=j;else minM=Math.min(minM,m);\n  }\n  if(fail>0){\n    const s=stack[fail-1];let sw=0,swx=0;\n    for(let k=fail;k<stack.length;k++){sw+=stack[k].w;swx+=stack[k].w*stack[k].x}\n    const dir=(swx/sw-s.x)>0?1:-1;\n    for(let k=fail;k<stack.length;k++){\n      const p=stack[k];\n      debris.push({x:p.x,y:gY-(k+1)*H0,w:p.w,c:p.c,n:p.n,vx:dir*(90+Math.random()*140),vy:-120-Math.random()*120,rot:0,vr:dir*(1+Math.random()*2)});\n    }\n    stack.length=fail;danger=0;\n    say('It was fine. Probably.');beep(120,.5,'sawtooth');\n    endGame();\n  }else danger=Math.max(0,Math.min(1,1-minM/.5));\n}\n\nfunction land(){\n  const n=stack.length,top=stack[n-1];\n  const ov=Math.min(cur.x+cur.w/2,top.x+top.w/2)-Math.max(cur.x-cur.w/2,top.x-top.w/2);\n  if(ov<8){\n    debris.push({x:cur.x,y:cur.y,w:cur.w,c:cur.c,n:cur.n,vx:(cur.x>top.x?1:-1)*120,vy:-60,rot:0,vr:(cur.x>top.x?1:-1)*2.5});\n    say('Missed it entirely.');beep(140,.4,'sawtooth');endGame();return;\n  }\n  let x=cur.x,perfect=Math.abs(cur.x-top.x)<7;\n  if(perfect){x=top.x;score++;pop('Perfect!',x,gY-(n+1)*H0+cam-10);beep(660,.25,'triangle')}\n  else beep(220,.18);\n  stack.push({x,w:cur.w,c:cur.c,n:cur.n});\n  score++;$('score').textContent=score;\n  checkStability();\n  if(state==='over')return;\n  if(perfect)say('Perfect!');\n  else if(danger>.6)say('It is fine. Probably.');\n  else say(quips[Math.floor(Math.random()*quips.length)]);\n  spawn();\n}\n\ncv.addEventListener('pointerdown',drop);\naddEventListener('keydown',e=>{\n  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(state==='over'&&overTimer<=0)newGame();else drop()}\n});\n$('again').onclick=()=>{wake();newGame()};\n\nfunction piece(x,top,w,c,n){\n  ctx.fillStyle=c;ctx.strokeStyle='#06222b';ctx.lineWidth=2.5;\n  ctx.beginPath();ctx.roundRect(x-w/2,top,w,H0,9);ctx.fill();ctx.stroke();\n  ctx.fillStyle='#06222b';ctx.font='600 '+Math.min(14,w/(n.length*.62))+'px system-ui,sans-serif';\n  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x,top+H0/2+1);\n}\n\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;\n  if(state==='over'&&overTimer>0){overTimer-=dt;if(overTimer<=0)showOver()}\n  const camT=Math.max(0,(stack.length-7)*H0);cam+=(camT-cam)*.08;\n\n  if(state==='play'){\n    const amp=Math.min(300,W/2-cur.w/2-16);\n    cur.x=W/2+Math.sin(t*(1.6+Math.min(score,40)*.05))*Math.max(amp,20);\n  }else if(state==='fall'){\n    cur.vy+=2400*dt;cur.y+=cur.vy*dt;\n    if(cur.y>=gY-(stack.length+1)*H0){cur.y=gY-(stack.length+1)*H0;land()}\n  }\n  for(let i=debris.length-1;i>=0;i--){\n    const d=debris[i];d.vy+=1800*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;\n    if(d.y+cam>H+200)debris.splice(i,1);\n  }\n\n  ctx.fillStyle='#0b3c49';ctx.fillRect(0,0,W,H);\n  // height markers\n  ctx.font='14px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='bottom';\n  for(let m=10;m<=200;m+=10){\n    const y=gY-(m+1)*H0+cam;if(y<-20||y>H)continue;\n    ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,248,231,.25)';ctx.lineWidth=1.5;\n    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);\n    ctx.fillStyle='rgba(255,248,231,.5)';ctx.fillText(m+' high',10,y-3);\n  }\n  // diner floor\n  const fy=gY+cam;\n  if(fy<H){\n    for(let cx=0;cx*40<W+40;cx++)for(let cy=0;fy+cy*40<H+40;cy++){\n      ctx.fillStyle=(cx+cy)%2?'#fff8e7':'#ef476f';ctx.fillRect(cx*40,fy+cy*40,40,40);\n    }\n  }\n  // tower\n  for(let i=0;i<stack.length;i++){\n    const p=stack[i],sway=i?Math.sin(t*9+i*.6)*danger*5*(i/stack.length):0;\n    piece(p.x+sway,gY-(i+1)*H0+cam,p.w,p.c,p.n);\n  }\n  if(cur&&state==='play'){\n    ctx.strokeStyle='rgba(255,248,231,.35)';ctx.lineWidth=2;\n    ctx.beginPath();ctx.moveTo(cur.x,0);ctx.lineTo(cur.x,90);ctx.stroke();\n    piece(cur.x,90,cur.w,cur.c,cur.n);\n  }else if(cur&&state==='fall')piece(cur.x,cur.y+cam,cur.w,cur.c,cur.n);\n  for(const d of debris){\n    ctx.save();ctx.translate(d.x,d.y+cam+H0/2);ctx.rotate(d.rot);\n    piece(0,-H0/2,d.w,d.c,d.n);ctx.restore();\n  }\n  for(let i=pops.length-1;i>=0;i--){\n    const p=pops[i];p.y-=40*dt;p.a-=dt*1.2;\n    if(p.a<=0){pops.splice(i,1);continue}\n    ctx.globalAlpha=p.a;ctx.fillStyle='#ffd23f';ctx.font=\"26px 'Bagel Fat One',system-ui,sans-serif\";\n    ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1;\n  }\n  requestAnimationFrame(frame);\n}\nnewGame();\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "emoji-dinner", "e": "🍳", "t": "Emoji Dinner", "d": "Flip pancakes at just the right moment and serve hungry customers.", "tag": "Arcade", "c": "#ff8fb1", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Emoji Dinner<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Chewy&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#1b1437;--ink:#fff4d6;--butter:#ffd166;--mint:#06d6a0;--berry:#ef476f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1b1437}}\n:root[data-theme=\"dark\"]{--bg:#1b1437}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}\n.disp{font-family:Chewy,'Arial Rounded MT Bold','Arial Black',system-ui,sans-serif}\n#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;pointer-events:none}\n#score{font-size:2.6rem;line-height:1;color:var(--butter)}\n#streak{font-size:1.1rem;color:var(--mint);min-height:1.3em}\n#hearts{font-size:1.6rem;letter-spacing:.1em}\n.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,9,32,.82);padding:16px}\n.ov.show{display:flex}\n.card{text-align:center;max-width:380px;padding:26px 28px;background:#2d2358;border-radius:28px}\n.card h1,.card h2{margin:0 0 8px;font-weight:400;font-size:2.6rem;color:var(--butter)}\n.card p{margin:6px 0 16px;line-height:1.5;font-size:1.05rem}\nbutton{font:inherit;font-size:1.3rem;color:#3a2200;background:var(--butter);border:0;border-radius:999px;padding:12px 30px;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--ink);outline-offset:3px}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Griddle with four pans. Tap a pan to pour, flip, or serve.\"><\/canvas>\n<div id=\"hud\">\n  <div><div id=\"score\" class=\"disp\">0<\/div><div id=\"streak\" class=\"disp\"><\/div><\/div>\n  <div id=\"hearts\" aria-label=\"Lives left\">❤️❤️❤️<\/div>\n<\/div>\n<div id=\"start\" class=\"ov show\"><div class=\"card\">\n  <h1 class=\"disp\">Emoji Dinner<\/h1>\n  <p>Tap an empty pan to pour batter.<br>Tap again to flip when the ring marker reaches the green zone.<br>Tap once more to serve the first customer in line.<br>Burnt or rushed pancakes cost points. Three walk-outs and the diner closes.<\/p>\n  <button id=\"go\">Open the diner<\/button>\n<\/div><\/div>\n<div id=\"end\" class=\"ov\"><div class=\"card\">\n  <h2 class=\"disp\">Kitchen closed<\/h2>\n  <p id=\"res\"><\/p>\n  <button id=\"again\">Cook again<\/button>\n<\/div><\/div>\n<\script>\nconst $=id=>document.getElementById(id);\nconst cv=$('c'),ctx=cv.getContext('2d');\nlet W=0,H=0,R=60,pos=[];\nfunction fit(){\n  const d=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);\n  R=Math.max(34,Math.min(W*.21,(H-230)/4.8,100));\n  const mid=(H+190)/2;\n  pos=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>({x:W/2+a*R*1.15,y:mid+b*R*1.15}));\n}\naddEventListener('resize',fit);fit();\n\nconst faces=['🐻','🐸','🐙','🦊','🐼','🐯','🐷'];\nlet best=0;try{best=+localStorage.getItem('rushBest')||0}catch(e){}\nlet pans,custs,puffs,pops,score,streak,lives,t,spawnT,running=false,ac=null;\nconst GOLD0=.6,GOLD1=1,DARK=1.3,MAXC=1.5;\n\nfunction beep(f,d,type){\n  if(!ac)return;\n  const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();\n  o.type=type||'sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+d);\n  g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);\n  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02);\n}\nfunction wake(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}\n\nfunction newGame(){\n  pans=[0,1,2,3].map(()=>({st:'empty',c:0,qa:0,grow:0,flip:1}));\n  custs=[];puffs=[];pops=[];score=0;streak=0;lives=3;t=0;spawnT=1;running=true;\n  hud();$('start').classList.remove('show');$('end').classList.remove('show');\n}\nfunction hud(){\n  $('score').textContent=score;\n  $('streak').textContent=streak>1?'Streak x'+streak:'';\n  $('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));\n}\nfunction pop(text,x,y,col){pops.push({text,x,y,a:1,col:col||'#ffd166'})}\nfunction quality(c){return c<GOLD0?.3:c<=GOLD1?1:c<=DARK?.5:0}\n\nfunction tapPan(i){\n  if(!running)return;\n  wake();\n  const p=pans[i];\n  if(p.st==='empty'){p.st='A';p.c=0;p.grow=0;beep(300,.12,'triangle')}\n  else if(p.st==='A'){p.qa=quality(p.c);p.st='B';p.c=0;p.flip=0;beep(520,.12,'triangle');\n    if(p.qa===1)pop('Nice flip',pos[i].x,pos[i].y-R,'#06d6a0')}\n  else if(p.st==='B')serve(i);\n  else if(p.st==='burnt'){p.st='empty';beep(180,.15,'square')}\n}\nfunction serve(i){\n  const p=pans[i],q=(p.qa+quality(p.c))/2,x=pos[i].x,y=pos[i].y;\n  p.st='empty';\n  const cu=custs.shift();\n  if(!cu){score+=1;pop('Snack break +1',x,y-R);beep(400,.1);hud();return}\n  if(q>=.9){streak++}else streak=0;\n  const gain=Math.round(10*q*(1+Math.min(streak,6)*.2)*(1+cu.pat/cu.max*.5));\n  score+=gain;\n  pop((q>=.95?'Golden! ':q>=.6?'Tasty ':'Meh ')+'+'+gain,x,y-R,q>=.95?'#06d6a0':'#ffd166');\n  beep(q>=.9?800:450,.2,'triangle');hud();\n}\n\nfunction update(dt){\n  t+=dt;\n  const rate=.24+Math.min(.14,t/420);\n  for(let i=0;i<4;i++){\n    const p=pans[i];\n    if(p.st==='A'||p.st==='B'){\n      p.c+=rate*dt;\n      if(p.c>DARK&&Math.random()<dt*10)puffs.push({x:pos[i].x+(Math.random()-.5)*R,y:pos[i].y,vy:-40,a:.6});\n      if(p.c>=MAXC){p.st='burnt';streak=0;pop('Burnt!',pos[i].x,pos[i].y-R,'#ef476f');beep(150,.4,'sawtooth');hud()}\n    }\n    p.grow=Math.min(1,p.grow+dt*5);p.flip=Math.min(1,p.flip+dt*4);\n  }\n  spawnT-=dt;\n  if(spawnT<=0&&custs.length<4){\n    const max=Math.max(13,22-t/18);\n    custs.push({e:faces[Math.floor(Math.random()*faces.length)],pat:max,max});\n    spawnT=Math.max(3.2,8-t/30);\n  }else if(spawnT<=0)spawnT=1;\n  for(let i=custs.length-1;i>=0;i--){\n    const c=custs[i];c.pat-=dt;\n    if(c.pat<=0){custs.splice(i,1);lives--;streak=0;pop('Walked out!',W/2,120,'#ef476f');beep(130,.4,'sawtooth');hud();if(lives<=0){finish();return}}\n  }\n  for(let i=puffs.length-1;i>=0;i--){const f=puffs[i];f.y+=f.vy*dt;f.a-=dt*.6;if(f.a<=0)puffs.splice(i,1)}\n}\nfunction finish(){\n  running=false;\n  if(score>best){best=score;try{localStorage.setItem('rushBest',best)}catch(e){}}\n  $('res').textContent='You scored '+score+'. Best: '+best+'.';\n  $('end').classList.add('show');$('again').focus();\n}\n\nfunction doneColor(c){\n  if(c<GOLD0)return `rgb(${243-Math.round(c/GOLD0*15)},${227-Math.round(c/GOLD0*40)},${176-Math.round(c/GOLD0*70)})`;\n  if(c<=GOLD1)return '#e0a040';\n  if(c<=DARK)return '#a5612a';\n  return c>=MAXC?'#1f140c':'#4a2a14';\n}\nfunction draw(){\n  ctx.fillStyle='#1b1437';ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='#2a2152';ctx.beginPath();ctx.roundRect(W/2-R*2.6,pos[0].y-R*1.5,R*5.2,R*5.1,30);ctx.fill();\n  // customers\n  const sp=Math.min(90,W/4.4);\n  ctx.textAlign='center';ctx.textBaseline='middle';\n  custs.forEach((c,i)=>{\n    const x=W/2+(i-(custs.length-1)/2)*sp,y=120,fr=c.pat/c.max;\n    ctx.font='40px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(c.e,x,y);\n    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x-28,y+30,56,7);\n    ctx.fillStyle=fr>.5?'#06d6a0':fr>.25?'#ffd166':'#ef476f';ctx.fillRect(x-28,y+30,56*Math.max(0,fr),7);\n    if(i===0){ctx.strokeStyle='#ffd166';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(x-34,y-30,68,74,14);ctx.stroke()}\n  });\n  // pans\n  pans.forEach((p,i)=>{\n    const {x,y}=pos[i];\n    ctx.fillStyle='#596273';ctx.beginPath();ctx.arc(x,y,R,0,6.283);ctx.fill();\n    ctx.fillStyle='#22262e';ctx.beginPath();ctx.arc(x,y,R*.9,0,6.283);ctx.fill();\n    if(p.st==='A'||p.st==='B'){\n      const a0=Math.PI*.75,span=Math.PI*1.5,k=v=>a0+v/MAXC*span;\n      ctx.lineWidth=7;ctx.lineCap='round';\n      ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(x,y,R*1.12,k(0),k(MAXC));ctx.stroke();\n      ctx.strokeStyle='#06d6a0';ctx.beginPath();ctx.arc(x,y,R*1.12,k(GOLD0),k(GOLD1));ctx.stroke();\n      ctx.strokeStyle='#ef476f';ctx.beginPath();ctx.arc(x,y,R*1.12,k(DARK),k(MAXC));ctx.stroke();\n      const mx=x+Math.cos(k(p.c))*R*1.12,my=y+Math.sin(k(p.c))*R*1.12;\n      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx,my,7,0,6.283);ctx.fill();\n    }\n    if(p.st!=='empty'){\n      const g=Math.min(1,p.grow)*(R*.78),sy=p.st==='B'?Math.abs(Math.cos(p.flip*Math.PI)):1;\n      ctx.save();ctx.translate(x,y);ctx.scale(1,Math.max(.05,sy));\n      ctx.fillStyle=p.st==='burnt'?'#1f140c':doneColor(p.c);\n      ctx.beginPath();ctx.arc(0,0,g,0,6.283);ctx.fill();\n      ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;ctx.stroke();\n      ctx.restore();\n      if(p.st!=='burnt'&&p.c>=GOLD0&&p.c<=GOLD1){\n        ctx.fillStyle='#fff';ctx.font=\"22px Chewy,system-ui,sans-serif\";\n        ctx.fillText(p.st==='A'?'Flip!':'Serve!',x,y+2);\n      }\n    }else{\n      ctx.fillStyle='rgba(255,255,255,.35)';ctx.font=\"20px Chewy,system-ui,sans-serif\";ctx.fillText('Pour',x,y);\n    }\n  });\n  for(const f of puffs){ctx.fillStyle=`rgba(200,200,210,${f.a})`;ctx.beginPath();ctx.arc(f.x,f.y,9,0,6.283);ctx.fill()}\n  for(let i=pops.length-1;i>=0;i--){\n    const p=pops[i];p.y-=35*(1/60);p.a-=.014;\n    if(p.a<=0){pops.splice(i,1);continue}\n    ctx.globalAlpha=p.a;ctx.fillStyle=p.col;ctx.font=\"24px Chewy,system-ui,sans-serif\";ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1;\n  }\n}\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.05,(now-last)/1000);last=now;\n  if(running)update(dt);\n  if(pans)draw();\n  requestAnimationFrame(frame);\n}\ncv.addEventListener('pointerdown',e=>{\n  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n  let bi=-1,bd=1e9;\n  pos.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;bi=i}});\n  if(bi>=0&&bd<R*1.4)tapPan(bi);\n});\naddEventListener('keydown',e=>{\n  const k='1234'.indexOf(e.key);if(k>=0)tapPan(k);\n});\n$('go').onclick=()=>{wake();newGame()};\n$('again').onclick=()=>{wake();newGame()};\npans=[0,1,2,3].map(()=>({st:'empty',c:0,qa:0,grow:0,flip:1}));custs=[];puffs=[];pops=[];\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "dinner-hall", "e": "🍽️", "t": "Dinner Hall", "d": "Walk a banquet hall in first person and catch emoji dishes.", "tag": "Adventure", "c": "#b8f35b", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dinner Hall<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Lilita+One&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#05140e;--ink:#fff6dc;--gold:#f4c95d;--wine:#7a1f3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#05140e}}\n:root[data-theme=\"dark\"]{--bg:#05140e}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}\n.disp{font-family:'Lilita One','Arial Rounded MT Bold','Arial Black',system-ui,sans-serif}\n#top{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 4px #000}\n#ttl{font-size:1.5rem;color:var(--gold)}\n#dex{font-size:.95rem;text-align:right}\n#foe{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);min-width:210px}\n.card{background:rgba(5,20,14,.82);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;font-size:1rem}\n.chip{display:inline-block;border-radius:999px;padding:0 9px;font-size:.8rem;color:#111;margin-left:6px}\n.bar{height:9px;background:#0008;border-radius:9px;margin-top:5px;overflow:hidden}\n.bar i{display:block;height:100%;transition:width .3s}\n#panel{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center}\n#me{align-self:flex-start;min-width:210px}\n#msg{min-height:2.6em;text-align:center;font-size:1.1rem;line-height:1.3;background:rgba(5,20,14,.82);border-radius:14px;padding:8px 14px;max-width:560px;width:100%;box-sizing:border-box}\n#btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}\nbutton{font:inherit;font-size:1.05rem;color:#2a1a00;background:var(--gold);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}\nbutton:disabled{opacity:.45;cursor:default}\nbutton:focus-visible{outline:3px solid #fff;outline-offset:2px}\n#step{font-size:1.4rem;padding:14px 40px}\n.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,20,14,.88);padding:16px}\n.ov.show{display:flex}\n.box{text-align:center;max-width:420px;background:#0f3d2c;border:3px solid var(--gold);border-radius:26px;padding:24px}\n.box h1,.box h2{margin:0 0 8px;font-weight:400;font-size:2.8rem;color:var(--gold)}\n.box p{line-height:1.5;margin:6px 0 14px}\n.pick{display:flex;gap:10px;justify-content:center}\n.pick button{font-size:2.6rem;padding:10px 14px;border-radius:20px;display:flex;flex-direction:column;align-items:center;line-height:1.1}\n.pick small{font-size:.85rem}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"First-person dining hall. Tap to step forward.\"><\/canvas>\n<div id=\"top\"><div id=\"ttl\" class=\"disp\">Dinner Hall<\/div><div id=\"dex\"><\/div><\/div>\n<div id=\"foe\" class=\"card\" hidden><\/div>\n<div id=\"panel\"><div id=\"me\" class=\"card\" hidden><\/div><div id=\"msg\">Walk the hall and catch every dish.<\/div><div id=\"btns\"><\/div><\/div>\n<div id=\"start\" class=\"ov show\"><div class=\"box\">\n  <h1 class=\"disp\">Dinner Hall<\/h1>\n  <p>Walk the endless banquet hall in first person. Wild dishes jump out at you. Tire them out, then catch them in your lunchbox. Collect all 9 to serve the full dinner.<\/p>\n  <p><b>Spicy<\/b> beats <b>Fresh<\/b>. <b>Fresh<\/b> beats <b>Sweet<\/b>. <b>Sweet<\/b> beats <b>Spicy<\/b>.<\/p>\n  <p>Pick your first dish:<\/p>\n  <div class=\"pick\" id=\"pick\"><\/div>\n<\/div><\/div>\n<div id=\"win\" class=\"ov\"><div class=\"box\"><h2 class=\"disp\">Dinner is served!<\/h2><p>You caught all 9 dishes. The table is full and everyone is stuffed.<\/p><button id=\"again\">Dine again<\/button><\/div><\/div>\n<\script>\nconst $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst SP=[['🌶️','Chili','Spicy',22,6],['🍕','Pizza','Spicy',26,6],['🌮','Taco','Spicy',24,6],['🥦','Broccoli','Fresh',28,5],['🥗','Salad','Fresh',24,6],['🍉','Melon','Fresh',30,5],['🍩','Donut','Sweet',26,6],['🍰','Cake','Sweet',24,7],['🍦','Sundae','Sweet',22,7]];\nconst TY={Spicy:{c:'#ff7a45',m:'Flame Sauce',b:'Fresh'},Fresh:{c:'#57cc99',m:'Leaf Whip',b:'Sweet'},Sweet:{c:'#ff9ad5',m:'Sugar Rush',b:'Spicy'}};\nconst cv=$('c'),ctx=cv.getContext('2d');\nlet W=0,H=0,hz=0;\nfunction fit(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}\naddEventListener('resize',fit);fit();\n\nlet team=[],dex=new Set(),foe=null,act=0,mode='title',busy=false,steps=0,ac=null;\nlet dist=0,distT=0,walking=false,appear=1,hurt=0,foeHit=0,swing=0,flashW=0,t=0;\nconst nm=c=>SP[c.s][0]+' '+SP[c.s][1],tp=c=>SP[c.s][2],me=()=>team[act];\nconst make=(s,lv)=>({s,lv,max:SP[s][3]+(lv-1)*4,atk:SP[s][4]+(lv-1),hp:SP[s][3]+(lv-1)*4});\nconst mulT=(a,d)=>TY[tp(a)].b===tp(d)?1.5:TY[tp(d)].b===tp(a)?.7:1;\nconst say=s=>{$('msg').textContent=s};\nfunction beep(f,d,type){\n  if(!ac)return;\n  const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();\n  o.type=type||'sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.6,n+d);\n  g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);\n  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02);\n}\nfunction wake(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}\n\nconst bar=c=>{const p=c.hp/c.max;return `<div class=\"bar\"><i style=\"width:${p*100}%;background:${p>.5?'#57cc99':p>.25?'#ffd166':'#ef476f'}\"><\/i><\/div>`};\nconst chip=c=>`<span class=\"chip\" style=\"background:${TY[tp(c)].c}\">${tp(c)}<\/span>`;\nfunction ui(){\n  $('dex').textContent='Dex '+dex.size+'/'+SP.length+'  '+SP.map((s,i)=>dex.has(i)?s[0]:'·').join('');\n  const m=me();\n  $('me').hidden=!m;\n  if(m)$('me').innerHTML=`<b>${nm(m)}<\/b> Lv ${m.lv}${chip(m)}${bar(m)}<div style=\"margin-top:4px\">${team.map((c,i)=>(i===act?'▸':'')+(c.hp>0?SP[c.s][0]:'💤')).join(' ')}<\/div>`;\n  $('foe').hidden=!foe;\n  if(foe)$('foe').innerHTML=`<b>${nm(foe)}<\/b> Lv ${foe.lv}${chip(foe)}${bar(foe)}`;\n  const d=busy||mode==='title';\n  $('btns').innerHTML=mode==='explore'?`<button id=\"step\" data-a=\"step\" ${d?'disabled':''}>Step forward<\/button>`:mode==='battle'?\n   `<button data-a=\"atk\" ${d?'disabled':''} style=\"background:${TY[tp(m)].c}\">${TY[tp(m)].m}<\/button><button data-a=\"bite\" ${d?'disabled':''}>Bite<\/button><button data-a=\"catch\" ${d?'disabled':''}>🧺 Lunchbox<\/button><button data-a=\"swap\" ${d?'disabled':''}>Swap<\/button><button data-a=\"run\" ${d?'disabled':''}>Run<\/button>`:'';\n}\n$('btns').onclick=e=>{const a=e.target.closest('button');if(a&&!a.disabled){wake();a.dataset.a==='step'?step():turn(a.dataset.a)}};\n\nfunction start(s){\n  wake();team=[make(s,3)];dex=new Set([s]);act=0;foe=null;mode='explore';busy=false;steps=0;\n  $('start').classList.remove('show');$('win').classList.remove('show');\n  say('Tap anywhere or press space to walk.');ui();\n}\n$('pick').innerHTML=[1,3,6].map(i=>`<button data-s=\"${i}\">${SP[i][0]}<small>${SP[i][2]}<\/small><\/button>`).join('');\n$('pick').onclick=e=>{const b=e.target.closest('button');if(b)start(+b.dataset.s)};\n$('again').onclick=()=>{mode='title';team=[];foe=null;dex=new Set();ui();$('win').classList.remove('show');$('start').classList.add('show')};\n\nasync function step(){\n  if(mode!=='explore'||busy)return;\n  busy=true;ui();distT+=1;\n  while(dist<distT)await sleep(30);\n  steps++;team.forEach(c=>c.hp=Math.min(c.max,c.hp+1));\n  if(steps>=3&&(Math.random()<.3||steps>=8)){\n    steps=0;\n    const i=Math.floor(Math.random()*SP.length),avg=team.reduce((a,c)=>a+c.lv,0)/team.length;\n    foe=make(i,Math.max(1,Math.round(avg+Math.floor(Math.random()*3)-1)));\n    mode='battle';flashW=1;appear=0;beep(600,.3,'triangle');say('A wild '+nm(foe)+' appeared!');\n  }\n  busy=false;ui();\n}\nasync function foeTurn(){\n  const m=me(),bite=Math.random()<.3,mult=bite?1:mulT(foe,m);\n  const dmg=Math.max(1,Math.round(foe.atk*(bite?.7:1)*mult*(.85+Math.random()*.3)));\n  say(nm(foe)+' used '+(bite?'Bite':TY[tp(foe)].m)+'!'+(mult>1?' Super effective!':mult<1?' Barely a nibble.':''));\n  await sleep(450);m.hp=Math.max(0,m.hp-dmg);hurt=1;beep(150,.25,'sawtooth');ui();await sleep(700);\n  if(m.hp<=0){\n    say(nm(m)+' is too full to fight!');await sleep(800);\n    const n=team.findIndex(c=>c.hp>0);\n    if(n<0){team.forEach(c=>c.hp=c.max);foe=null;mode='explore';say('Dinner ruined. You wake up at the table, fully healed.');return}\n    act=n;say('Go, '+nm(me())+'!');ui();await sleep(600);\n  }\n}\nasync function turn(a){\n  if(busy||!foe||mode!=='battle')return;\n  busy=true;ui();const m=me();\n  if(a==='atk'||a==='bite'){\n    const mult=a==='atk'?mulT(m,foe):1,dmg=Math.max(1,Math.round(m.atk*(a==='bite'?.7:1)*mult*(.85+Math.random()*.3)));\n    say(nm(m)+' used '+(a==='atk'?TY[tp(m)].m:'Bite')+'!'+(mult>1?' Super tasty!':mult<1?' Not very tasty.':''));\n    swing=1;await sleep(400);foe.hp=Math.max(0,foe.hp-dmg);foeHit=1;beep(a==='atk'?500:350,.2,'square');ui();await sleep(700);\n    if(foe.hp<=0){\n      say(nm(foe)+' was defeated!');await sleep(800);\n      if(m.lv<10){m.lv++;m.max+=4;m.atk++;m.hp=Math.min(m.max,m.hp+6);say(nm(m)+' grew to Lv '+m.lv+'!');beep(700,.4,'triangle');await sleep(1000)}\n      foe=null;mode='explore';busy=false;ui();return;\n    }\n  }else if(a==='catch'){\n    say('You throw a lunchbox!');swing=1;await sleep(900);\n    if(Math.random()<.15+.7*(1-foe.hp/foe.max)){\n      const n=foe;dex.add(n.s);if(team.length<4)team.push(n);\n      say('Gotcha! '+nm(n)+(team.length<=4&&team[team.length-1]===n?' joined your team!':' went into the fridge.'));\n      beep(800,.5,'triangle');foe=null;mode='explore';await sleep(1200);\n      if(dex.size===SP.length){$('win').classList.add('show')}\n      busy=false;ui();return;\n    }\n    say('It burst out of the lunchbox!');await sleep(700);\n  }else if(a==='swap'){\n    let n=-1;for(let k=1;k<team.length;k++){const j=(act+k)%team.length;if(team[j].hp>0){n=j;break}}\n    if(n<0){say('Nobody else is hungry enough.');busy=false;ui();return}\n    act=n;say('Go, '+nm(me())+'!');ui();await sleep(700);\n  }else if(a==='run'){\n    if(Math.random()<.6){say('You slipped away.');await sleep(800);foe=null;mode='explore';busy=false;ui();return}\n    say(\"Can't escape!\");await sleep(700);\n  }\n  await foeTurn();\n  busy=false;ui();\n}\ncv.addEventListener('pointerdown',()=>{wake();step()});\naddEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&e.target.tagName!=='BUTTON'){e.preventDefault();step()}});\n\nconst R=s=>({x0:W/2-(W*.1+W*.4*s),x1:W/2+(W*.1+W*.4*s),y0:hz-(H*.08+H*.5*s),y1:hz+(H*.08+H*.45*s)});\nconst q=(p,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<4;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.fill()};\nconst EF='\"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\nlet last=performance.now();\nfunction draw(now){\n  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;hz=H*.45;\n  if(dist<distT){dist=Math.min(distT,dist+dt*2.3);walking=dist<distT}\n  const fr=dist%1,fl=Math.floor(dist);\n  ctx.save();ctx.translate(0,walking?Math.sin(dist*6.283*2)*4:0);\n  ctx.fillStyle='#05140e';ctx.fillRect(-10,-10,W+20,H+20);\n  const sc=k=>1/(1+(k-fr)*.55);\n  for(let k=10;k>=0;k--){\n    const a=R(sc(k)),b=R(sc(k+1)),par=(k+fl)%2;\n    q([[a.x0,a.y1],[a.x1,a.y1],[b.x1,b.y1],[b.x0,b.y1]],par?'#1c1c24':'#2b2b36');\n    const w=a.x1-a.x0,v=b.x1-b.x0;\n    q([[a.x0+w*.36,a.y1],[a.x0+w*.64,a.y1],[b.x0+v*.64,b.y1],[b.x0+v*.36,b.y1]],'#7a1f3d');\n    q([[a.x0,a.y0],[a.x1,a.y0],[b.x1,b.y0],[b.x0,b.y0]],'#0d2a1f');\n    q([[a.x0,a.y0],[a.x0,a.y1],[b.x0,b.y1],[b.x0,b.y0]],par?'#0f4a36':'#0c3d2c');\n    q([[a.x1,a.y0],[a.x1,a.y1],[b.x1,b.y1],[b.x1,b.y0]],par?'#0f4a36':'#0c3d2c');\n  }\n  for(let k=10;k>=0;k--){\n    const s=sc(k),r=R(s);\n    if((k+fl)%2===0){ctx.strokeStyle='#f4c95d';ctx.lineWidth=Math.max(1,5*s);ctx.strokeRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0)}\n    else{\n      const g=ctx.createRadialGradient(0,0,0,0,0,30*s);g.addColorStop(0,'#fff3b0');g.addColorStop(1,'#f4c95d00');\n      ctx.fillStyle=g;\n      for(const x of[r.x0+10*s,r.x1-10*s]){ctx.save();ctx.translate(x,hz-(r.y1-r.y0)*.18);ctx.fillRect(-30*s,-30*s,60*s,60*s);ctx.restore()}\n    }\n  }\n  ctx.restore();\n  ctx.textAlign='center';ctx.textBaseline='middle';\n  if(foe){\n    appear=Math.min(1,appear+dt*3);\n    const sz=Math.min(W,H)*.4*appear*(1+Math.sin(t*3)*.03),cy=hz+H*.03;\n    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(W/2,cy+sz*.5,sz*.45,sz*.1,0,0,6.283);ctx.fill();\n    ctx.globalAlpha=foeHit>0&&Math.floor(t*20)%2?.25:1;\n    ctx.font=sz+'px '+EF;ctx.fillText(SP[foe.s][0],W/2+(foeHit>0?Math.sin(t*60)*8:0),cy);ctx.globalAlpha=1;\n  }\n  const off=Math.sin(Math.min(1,swing)*Math.PI);\n  ctx.font='76px '+EF;ctx.save();ctx.translate(W-70-off*W*.3,H-210-off*H*.25);ctx.rotate(-.5-off*.6);ctx.fillText('🍴',0,0);ctx.restore();\n  if(hurt>0){ctx.fillStyle=`rgba(239,71,111,${hurt*.4})`;ctx.fillRect(0,0,W,H)}\n  if(flashW>0){ctx.fillStyle=`rgba(255,255,255,${flashW*.8})`;ctx.fillRect(0,0,W,H)}\n  hurt=Math.max(0,hurt-dt*2);foeHit=Math.max(0,foeHit-dt*2);swing=Math.max(0,swing-dt*2.5);flashW=Math.max(0,flashW-dt*2.5);\n  requestAnimationFrame(draw);\n}\nui();\nrequestAnimationFrame(draw);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "snack-safari", "e": "🌿", "t": "Snack Safari", "d": "WASD through a 3D meadow and catch wild snacks in the tall grass.", "tag": "Adventure", "c": "#8fe388", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Snack Safari<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Lilita+One&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#10263a;--ink:#fff6dc;--gold:#ffd166;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10263a}}\n:root[data-theme=\"dark\"]{--bg:#10263a}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%}\n.disp{font-family:'Lilita One','Arial Rounded MT Bold','Arial Black',system-ui,sans-serif}\n#top{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 4px #000}\n#ttl{font-size:1.5rem;color:var(--gold)}\n#dex{font-size:.95rem;text-align:right}\n.card{background:rgba(16,38,58,.86);border:2px solid var(--gold);border-radius:16px;padding:8px 14px}\n#foe{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);min-width:210px}\n#foeE{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:min(42vw,42vh);line-height:1;pointer-events:none;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 18px 12px #0008)}\n#foeE.hit{animation:blink .4s steps(2) 1}\n@keyframes bob{50%{transform:translate(-50%,-54%)}}\n@keyframes blink{50%{opacity:.15}}\n.fx{position:absolute;inset:0;pointer-events:none;opacity:0}\n.fx.go{animation:fx .6s ease-out}\n@keyframes fx{from{opacity:.85}to{opacity:0}}\n.chip{display:inline-block;border-radius:999px;padding:0 9px;font-size:.8rem;color:#111;margin-left:6px}\n.bar{height:9px;background:#0008;border-radius:9px;margin-top:5px;overflow:hidden}\n.bar i{display:block;height:100%;transition:width .3s}\n#panel{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}\n#panel>*{pointer-events:auto}\n#me{align-self:flex-start;min-width:210px}\n#msg{text-align:center;font-size:1.05rem;line-height:1.3;background:rgba(16,38,58,.86);border-radius:14px;padding:8px 14px;max-width:560px;box-sizing:border-box}\n#btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}\nbutton{font:inherit;font-size:1.05rem;color:#2a1a00;background:var(--gold);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}\nbutton:disabled{opacity:.45;cursor:default}\nbutton:focus-visible{outline:3px solid #fff;outline-offset:2px}\n#pad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}\n#pad button{padding:0;font-size:1.5rem;border-radius:16px;opacity:.85;touch-action:none}\n#pad .u{grid-column:2}\n@media (pointer:coarse){#pad.on{display:grid}}\n.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(16,38,58,.9);padding:16px}\n.ov.show{display:flex}\n.box{text-align:center;max-width:430px;background:#16405a;border:3px solid var(--gold);border-radius:26px;padding:24px}\n.box h1,.box h2{margin:0 0 8px;font-weight:400;font-size:2.8rem;color:var(--gold)}\n.box p{line-height:1.5;margin:6px 0 14px}\n.pick{display:flex;gap:10px;justify-content:center}\n.pick button{font-size:2.6rem;padding:10px 14px;border-radius:20px;display:flex;flex-direction:column;align-items:center;line-height:1.1}\n.pick small{font-size:.85rem}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"First-person meadow. Use W A S D to walk.\"><\/canvas>\n<div id=\"foeE\" hidden><\/div>\n<div class=\"fx\" id=\"fxW\" style=\"background:#fff\"><\/div>\n<div class=\"fx\" id=\"fxR\" style=\"background:#ef476f\"><\/div>\n<div id=\"top\"><div id=\"ttl\" class=\"disp\">Snack Safari<\/div><div id=\"dex\"><\/div><\/div>\n<div id=\"foe\" class=\"card\" hidden><\/div>\n<div id=\"panel\"><div id=\"me\" class=\"card\" hidden><\/div><div id=\"msg\">Walk into the tall grass to find wild snacks.<\/div><div id=\"btns\"><\/div>\n<div id=\"pad\"><button class=\"u\" data-k=\"w\" aria-label=\"Forward\">▲<\/button><button data-k=\"a\" aria-label=\"Turn left\">◀<\/button><button data-k=\"s\" aria-label=\"Back\">▼<\/button><button data-k=\"d\" aria-label=\"Turn right\">▶<\/button><\/div><\/div>\n<div id=\"start\" class=\"ov show\"><div class=\"box\">\n  <h1 class=\"disp\">Snack Safari<\/h1>\n  <p>Explore the meadow in first person. Wild snacks hide in the tall grass. Weaken them, then catch them in your lunchbox. Collect all 9!<\/p>\n  <p><b>W / S<\/b> walk, <b>A / D<\/b> turn, <b>Q / E<\/b> slide sideways. The red picnic blanket heals your team.<\/p>\n  <p><b>Spicy<\/b> beats <b>Fresh<\/b>, <b>Fresh<\/b> beats <b>Sweet<\/b>, <b>Sweet<\/b> beats <b>Spicy<\/b>. Pick your first snack:<\/p>\n  <div class=\"pick\" id=\"pick\"><\/div>\n<\/div><\/div>\n<div id=\"win\" class=\"ov\"><div class=\"box\"><h2 class=\"disp\">Safari complete!<\/h2><p>You caught all 9 snacks. The meadow is yours.<\/p><button id=\"again\">Play again<\/button><\/div><\/div>\n<\script>\nconst $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst SP=[['🌶️','Chili','Spicy',22,6],['🍕','Pizza','Spicy',26,6],['🌮','Taco','Spicy',24,6],['🥦','Broccoli','Fresh',28,5],['🥗','Salad','Fresh',24,6],['🍉','Melon','Fresh',30,5],['🍩','Donut','Sweet',26,6],['🍰','Cake','Sweet',24,7],['🍦','Sundae','Sweet',22,7]];\nconst TY={Spicy:{c:'#ff7a45',m:'Flame Sauce',b:'Fresh'},Fresh:{c:'#57cc99',m:'Leaf Whip',b:'Sweet'},Sweet:{c:'#ff9ad5',m:'Sugar Rush',b:'Spicy'}};\nconst MAP=[\n\"####################\",\n\"#..................#\",\n\"#.H..gggg....gggg..#\",\n\"#....gggg....gggg..#\",\n\"#....gggg..##......#\",\n\"#..........##..ggg.#\",\n\"#.ggg......##..ggg.#\",\n\"#.ggg..............#\",\n\"#.ggg...gggggg.....#\",\n\"#.......gggggg..##.#\",\n\"#..gg...gggggg..##.#\",\n\"#..gg..............#\",\n\"#......####..ggg...#\",\n\"#..ggg.####..ggg...#\",\n\"#..................#\",\n\"####################\"];\nconst cv=$('c'),ctx=cv.getContext('2d'),buf=document.createElement('canvas');\nlet W=0,H=0,RW=240,RH=135,img,bctx;\nfunction fit(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W;cv.height=H;RH=Math.max(90,Math.round(RW*H/W));buf.width=RW;buf.height=RH;bctx=buf.getContext('2d');img=bctx.createImageData(RW,RH)}\naddEventListener('resize',fit);fit();\n\nlet px=3.5,py=3.5,ang=0,keys={},team=[],dex=new Set(),foe=null,act=0,mode='title',busy=false,stepAcc=0,prev='',ac=null;\nconst nm=c=>SP[c.s][0]+' '+SP[c.s][1],tp=c=>SP[c.s][2],me=()=>team[act];\nconst make=(s,lv)=>({s,lv,max:SP[s][3]+(lv-1)*4,atk:SP[s][4]+(lv-1),hp:SP[s][3]+(lv-1)*4});\nconst mulT=(a,d)=>TY[tp(a)].b===tp(d)?1.5:TY[tp(d)].b===tp(a)?.7:1;\nconst say=s=>{$('msg').textContent=s};\nfunction fx(id){const e=$(id);e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}\nfunction beep(f,d,type){\n  if(!ac)return;\n  const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();\n  o.type=type||'sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.6,n+d);\n  g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);\n  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02);\n}\nfunction wake(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}\n\nconst bar=c=>{const p=c.hp/c.max;return `<div class=\"bar\"><i style=\"width:${p*100}%;background:${p>.5?'#57cc99':p>.25?'#ffd166':'#ef476f'}\"><\/i><\/div>`};\nconst chip=c=>`<span class=\"chip\" style=\"background:${TY[tp(c)].c}\">${tp(c)}<\/span>`;\nfunction ui(){\n  $('dex').textContent='Dex '+dex.size+'/'+SP.length+'  '+SP.map((s,i)=>dex.has(i)?s[0]:'·').join('');\n  const m=me();\n  $('me').hidden=!m||mode==='title';\n  if(m)$('me').innerHTML=`<b>${nm(m)}<\/b> Lv ${m.lv}${chip(m)}${bar(m)}<div style=\"margin-top:4px\">${team.map((c,i)=>(i===act?'▸':'')+(c.hp>0?SP[c.s][0]:'💤')).join(' ')}<\/div>`;\n  $('foe').hidden=!foe;$('foeE').hidden=!foe;\n  if(foe){$('foe').innerHTML=`<b>${nm(foe)}<\/b> Lv ${foe.lv}${chip(foe)}${bar(foe)}`;$('foeE').textContent=SP[foe.s][0]}\n  const d=busy?'disabled':'';\n  $('btns').innerHTML=mode==='battle'?`<button data-a=\"atk\" ${d} style=\"background:${TY[tp(m)].c}\">${TY[tp(m)].m}<\/button><button data-a=\"bite\" ${d}>Bite<\/button><button data-a=\"catch\" ${d}>🧺 Lunchbox<\/button><button data-a=\"swap\" ${d}>Swap<\/button><button data-a=\"run\" ${d}>Run<\/button>`:'';\n  $('pad').classList.toggle('on',mode==='explore');\n}\n$('btns').onclick=e=>{const a=e.target.closest('button');if(a&&!a.disabled){wake();turn(a.dataset.a)}};\n\nfunction start(s){\n  wake();team=[make(s,3)];dex=new Set([s]);act=0;foe=null;mode='explore';busy=false;px=3.5;py=3.5;ang=0;stepAcc=0;prev='';keys={};\n  $('start').classList.remove('show');$('win').classList.remove('show');say('Walk into the tall grass (darker green) to find wild snacks.');ui();\n}\n$('pick').innerHTML=[1,3,6].map(i=>`<button data-s=\"${i}\">${SP[i][0]}<small>${SP[i][2]}<\/small><\/button>`).join('');\n$('pick').onclick=e=>{const b=e.target.closest('button');if(b)start(+b.dataset.s)};\n$('again').onclick=()=>{mode='title';team=[];foe=null;dex=new Set();ui();$('win').classList.remove('show');$('start').classList.add('show')};\n\nfunction encounter(){\n  const i=Math.floor(Math.random()*SP.length),avg=team.reduce((a,c)=>a+c.lv,0)/team.length;\n  foe=make(i,Math.max(1,Math.round(avg+Math.floor(Math.random()*3)-1)));\n  mode='battle';keys={};fx('fxW');beep(600,.3,'triangle');say('A wild '+nm(foe)+' jumped out of the grass!');ui();\n}\nasync function foeTurn(){\n  const m=me(),bite=Math.random()<.3,mult=bite?1:mulT(foe,m);\n  const dmg=Math.max(1,Math.round(foe.atk*(bite?.7:1)*mult*(.85+Math.random()*.3)));\n  say(nm(foe)+' used '+(bite?'Bite':TY[tp(foe)].m)+'!'+(mult>1?' Super effective!':mult<1?' Barely a nibble.':''));\n  await sleep(450);m.hp=Math.max(0,m.hp-dmg);fx('fxR');beep(150,.25,'sawtooth');ui();await sleep(700);\n  if(m.hp<=0){\n    say(nm(m)+' is too full to fight!');await sleep(800);\n    const n=team.findIndex(c=>c.hp>0);\n    if(n<0){team.forEach(c=>c.hp=c.max);foe=null;mode='explore';px=3.5;py=3.5;say('Out of energy! You wake up at the start, team healed.');return}\n    act=n;say('Go, '+nm(me())+'!');ui();await sleep(600);\n  }\n}\nasync function turn(a){\n  if(busy||!foe||mode!=='battle')return;\n  busy=true;ui();const m=me();\n  if(a==='atk'||a==='bite'){\n    const mult=a==='atk'?mulT(m,foe):1,dmg=Math.max(1,Math.round(m.atk*(a==='bite'?.7:1)*mult*(.85+Math.random()*.3)));\n    say(nm(m)+' used '+(a==='atk'?TY[tp(m)].m:'Bite')+'!'+(mult>1?' Super tasty!':mult<1?' Not very tasty.':''));\n    await sleep(400);foe.hp=Math.max(0,foe.hp-dmg);const e=$('foeE');e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit');beep(a==='atk'?500:350,.2,'square');ui();await sleep(700);\n    if(foe.hp<=0){\n      say(nm(foe)+' was defeated!');await sleep(800);\n      if(m.lv<10){m.lv++;m.max+=4;m.atk++;m.hp=Math.min(m.max,m.hp+6);say(nm(m)+' grew to Lv '+m.lv+'!');beep(700,.4,'triangle');await sleep(1000)}\n      foe=null;mode='explore';busy=false;ui();return;\n    }\n  }else if(a==='catch'){\n    say('You throw a lunchbox!');await sleep(900);\n    if(Math.random()<.15+.7*(1-foe.hp/foe.max)){\n      const n=foe;dex.add(n.s);const joined=team.length<4;if(joined)team.push(n);\n      say('Gotcha! '+nm(n)+(joined?' joined your team!':' went into the cooler.'));\n      beep(800,.5,'triangle');foe=null;mode='explore';await sleep(1200);\n      if(dex.size===SP.length)$('win').classList.add('show');\n      busy=false;ui();return;\n    }\n    say('It burst out of the lunchbox!');await sleep(700);\n  }else if(a==='swap'){\n    let n=-1;for(let k=1;k<team.length;k++){const j=(act+k)%team.length;if(team[j].hp>0){n=j;break}}\n    if(n<0){say('Nobody else is hungry enough.');busy=false;ui();return}\n    act=n;say('Go, '+nm(me())+'!');ui();await sleep(700);\n  }else if(a==='run'){\n    if(Math.random()<.6){say('You dashed away.');await sleep(800);foe=null;mode='explore';busy=false;ui();return}\n    say(\"Can't escape!\");await sleep(700);\n  }\n  await foeTurn();\n  busy=false;ui();\n}\n\naddEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys[k]=1;e.preventDefault()}});\naddEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});\naddEventListener('blur',()=>{keys={}});\n$('pad').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){wake();keys[b.dataset.k]=1}});\nconst rel=()=>{for(const k of['w','a','s','d'])delete keys[k]};\naddEventListener('pointerup',rel);addEventListener('pointercancel',rel);\n\nconst blk=(x,y)=>{const r=MAP[Math.floor(y)];return !r||r[Math.floor(x)]==='#'||r[Math.floor(x)]===undefined};\nconst ok=(x,y)=>!(blk(x-.2,y-.2)||blk(x+.2,y-.2)||blk(x-.2,y+.2)||blk(x+.2,y+.2));\nfunction move(dt){\n  const k=keys,f=(k.w||k.arrowup?1:0)-(k.s||k.arrowdown?1:0),st=(k.e?1:0)-(k.q?1:0);\n  ang+=((k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0))*2.3*dt;\n  const dx=Math.cos(ang),dy=Math.sin(ang),vx=(dx*f-dy*st)*3*dt,vy=(dy*f+dx*st)*3*dt;\n  if(ok(px+vx,py))px+=vx;if(ok(px,py+vy))py+=vy;\n  const c=MAP[Math.floor(py)][Math.floor(px)],moved=Math.hypot(vx,vy);\n  if(c==='H'&&prev!=='H'&&team.some(m=>m.hp<m.max)){team.forEach(m=>m.hp=m.max);say('Picnic time! Your team is fully healed.');beep(700,.3,'triangle');ui()}\n  prev=c;\n  if(c==='g'&&moved>0){stepAcc+=moved;if(stepAcc>.9){stepAcc=0;if(Math.random()<.25)encounter()}}\n}\n\nfunction render(){\n  const w=RW,h=RH,d=img.data,hh=h>>1;\n  const dx=Math.cos(ang),dy=Math.sin(ang),plx=-dy*.75,ply=dx*.75;\n  for(let y=0;y<hh;y++){const p=y/hh,r=110+p*80,g=175+p*50;for(let x=0;x<w;x++){const i=(y*w+x)*4;d[i]=r;d[i+1]=g;d[i+2]=245;d[i+3]=255}}\n  const r0x=dx-plx,r0y=dy-ply,r1x=dx+plx,r1y=dy+ply;\n  for(let y=hh;y<h;y++){\n    const rd=.5*h/(y-hh+.5),sx=rd*(r1x-r0x)/w,sy=rd*(r1y-r0y)/w,fog=Math.max(.3,1-rd/13);\n    let fx=px+rd*r0x,fy=py+rd*r0y;\n    for(let x=0;x<w;x++,fx+=sx,fy+=sy){\n      const tx=Math.floor(fx),ty=Math.floor(fy),c=MAP[ty]&&MAP[ty][tx];\n      let r,g,b;\n      if(c==='g'){const n=((fx*7)+(fy*7)&1)|((Math.floor(fx*7)+Math.floor(fy*7))&1);r=n?34:48;g=n?110:140;b=n?48:66}\n      else if(c==='H'){const n=(Math.floor(fx*3)+Math.floor(fy*3))&1;r=n?250:225;g=n?245:70;b=n?245:95}\n      else{const n=(tx+ty)&1;r=n?216:202;g=n?192:178;b=n?148:134}\n      const i=(y*w+x)*4;d[i]=r*fog;d[i+1]=g*fog;d[i+2]=b*fog;d[i+3]=255;\n    }\n  }\n  for(let x=0;x<w;x++){\n    const cx=2*x/w-1,rx=dx+plx*cx,ry=dy+ply*cx;\n    let mx=Math.floor(px),my=Math.floor(py);\n    const ddx=Math.abs(1/(rx||1e-9)),ddy=Math.abs(1/(ry||1e-9));\n    let stx,sty,sdx,sdy;\n    if(rx<0){stx=-1;sdx=(px-mx)*ddx}else{stx=1;sdx=(mx+1-px)*ddx}\n    if(ry<0){sty=-1;sdy=(py-my)*ddy}else{sty=1;sdy=(my+1-py)*ddy}\n    let side=0,hit=false;\n    for(let n=0;n<40&&!hit;n++){\n      if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}\n      const c=MAP[my]&&MAP[my][mx];\n      if(c==='#')hit=true;else if(!c)break;\n    }\n    if(!hit)continue;\n    const perp=Math.max(.05,side?sdy-ddy:sdx-ddx),lh=h/perp;\n    let wx=side?px+perp*rx:py+perp*ry;wx-=Math.floor(wx);\n    const top=hh-lh/2,f=Math.max(.3,1-perp/12)*(side?.75:1);\n    for(let y=Math.max(0,Math.floor(top));y<Math.min(h,Math.floor(top+lh));y++){\n      const t=(y-top)/lh;let r,g,b;\n      if(t>.7&&Math.abs(wx-.5)<.13){r=107;g=68;b=35}\n      else{const n=(Math.floor(wx*8)+Math.floor(t*8))&1;r=n?30:24;g=n?125:100;b=n?52:42}\n      const i=(y*w+x)*4;d[i]=r*f;d[i+1]=g*f;d[i+2]=b*f;d[i+3]=255;\n    }\n  }\n}\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.05,(now-last)/1000);last=now;\n  if(mode==='explore'&&!busy)move(dt);\n  render();bctx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(buf,0,0,W,H);\n  requestAnimationFrame(frame);\n}\nui();requestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "egg-island", "e": "🥚", "t": "Egg Island", "d": "Hatch eggs, fill your island with creatures, and buy upgrades.", "tag": "Idle", "c": "#ffd43b", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Egg Island<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Paytone+One&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#0b3954;--ink:#fff3d1;--coral:#ff6b6b;--gold:#ffd166;--card:#124e73;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0b3954}}\n:root[data-theme=\"dark\"]{--bg:#0b3954}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}\n.disp{font-family:'Paytone One','Arial Rounded MT Bold','Arial Black',system-ui,sans-serif}\n#hud{display:flex;align-items:center;gap:14px;padding:10px 14px}\n#coins{font-size:1.9rem;color:var(--gold)}\n#rate{flex:1;font-size:.95rem;opacity:.85}\n#hud button{font-size:.8rem;padding:6px 12px;background:#ffffff22;color:var(--ink)}\nmain{flex:1;min-height:150px;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%}\n#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000b;padding:8px 16px;border-radius:999px;font-size:1.05rem;opacity:0;pointer-events:none;white-space:nowrap}\n#toast.go{animation:t 2.4s ease-out}\n@keyframes t{0%{opacity:0;top:0}10%{opacity:1;top:12px}80%{opacity:1}100%{opacity:0}}\n#panel{background:var(--card);border-radius:22px 22px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));height:min(46vh,340px);display:flex;flex-direction:column;gap:8px}\n#nest{display:flex;gap:8px}\n.slot{flex:1;min-width:0;background:#0b3954;border:2px solid var(--coral);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font:inherit;cursor:pointer}\n.slot.empty{border-style:dashed;border-color:#ffffff44;opacity:.7;cursor:default;font-size:.85rem;text-align:center;justify-content:center}\n.slot small{font-size:.7rem;opacity:.8}\n.egg{font-size:2rem;line-height:1;display:inline-block}\n.slot .egg{animation:wob 1.4s ease-in-out infinite}\n@keyframes wob{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}\n.bar{display:block;width:88%;height:8px;background:#000a;border-radius:8px;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--gold)}\n#tabs{display:flex;gap:6px}\n#tabs button{flex:1;background:#0b3954;color:var(--ink);font-size:.95rem;padding:7px}\n#tabs button.on{background:var(--coral);color:#3b0a0a}\n#tab{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}\n.row{display:flex;align-items:center;gap:10px;background:#0b3954;border-radius:14px;padding:6px 10px}\n.row div{flex:1;min-width:0;line-height:1.25}\n.row small{display:block;opacity:.75;font-size:.78rem}\nbutton{font:inherit;font-weight:600;color:#3b2a00;background:var(--gold);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}\nbutton.no{opacity:.4}\nbutton:focus-visible{outline:3px solid #fff;outline-offset:2px}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}\n.cell{background:#0b3954;border-radius:12px;text-align:center;padding:6px 2px;font-size:1.7rem;line-height:1.1}\n.cell small{display:block;font-size:.68rem;opacity:.8}\n<\/style>\n<\/head>\n<body>\n<div id=\"hud\"><div id=\"coins\" class=\"disp\">🪙 0<\/div><div id=\"rate\"><\/div><button id=\"reset\">Reset<\/button><\/div>\n<main><canvas id=\"c\" aria-label=\"Your island. Tap a creature with a gold dot to collect coins.\"><\/canvas><div id=\"toast\" class=\"disp\"><\/div><\/main>\n<div id=\"panel\">\n  <div id=\"nest\"><\/div>\n  <div id=\"tabs\"><button data-tab=\"shop\">Egg Shop<\/button><button data-tab=\"up\">Upgrades<\/button><button data-tab=\"col\">Collection<\/button><\/div>\n  <div id=\"tab\"><\/div>\n<\/div>\n<\script>\nconst $=id=>document.getElementById(id);\nconst RAR=['Common','Uncommon','Rare','Epic','Legendary'],RC=['#cfd8dc','#7bd389','#4cc9f0','#c77dff','#ffd166'],INC=[1,3,8,25,80];\nconst SPECIES=[[['🐣','Chick'],['🦆','Duck'],['🐸','Frog'],['🐢','Turtle']],[['🦀','Crab'],['🐙','Octopus'],['🦜','Parrot']],[['🦩','Flamingo'],['🐬','Dolphin'],['🦭','Seal']],[['🦖','Rex'],['🦈','Shark'],['🦅','Eagle']],[['🦄','Unicorn'],['🐉','Dragon']]];\nconst EGGS=[\n {n:'Sandy Egg',cost:15,need:20,w:[80,18,2,0,0],f:'none'},\n {n:'Coral Egg',cost:120,need:45,w:[0,50,40,10,0],f:'hue-rotate(150deg) saturate(2.2)'},\n {n:'Golden Egg',cost:900,need:90,w:[0,0,50,40,10],f:'sepia(1) saturate(5)'}];\nconst UP=[\n {id:'hands',n:'Warm Hands',d:'+1 warmth per tap',base:30,g:1.7,max:25},\n {id:'cozy',n:'Cozy Nests',d:'Eggs warm themselves',base:50,g:1.75,max:25},\n {id:'slots',n:'Nest Slots',d:'Hold one more egg',costs:[100,400,1600],max:3},\n {id:'basket',n:'Coin Basket',d:'+25% coins from everything',base:80,g:1.8,max:25},\n {id:'lucky',n:'Lucky Charm',d:'Rarer creatures hatch more often',base:200,g:2,max:10}];\nconst upCost=(u,l)=>u.costs?u.costs[l]:Math.floor(u.base*Math.pow(u.g,l));\n\nlet S={coins:30,cr:[],up:{hands:0,cozy:0,slots:0,basket:0,lucky:0},nest:[{t:0,w:0}]};\ntry{const s=JSON.parse(localStorage.getItem('eggIsland'));if(s&&s.up&&s.nest)S=s}catch(e){}\nfunction save(){try{localStorage.setItem('eggIsland',JSON.stringify(S))}catch(e){}}\nlet tab='shop',ac=null;\nconst income=()=>S.cr.reduce((a,c)=>a+INC[c[0]],0)*(1+.25*S.up.basket);\nconst fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n)+'';\n\nfunction beep(f,d){\n  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();\n  const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+d);\n  g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}\n}\nfunction toast(s){const e=$('toast');e.textContent=s;e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}\n\n// sprites\nlet spr=[],pops=[];\nfunction mkSprite(c){return{r:c[0],e:SPECIES[c[0]][c[1]][0],x:(Math.random()*2-1)*.8,y:(Math.random()*2-1)*.7,tx:0,ty:0,wait:Math.random()*2,cd:0,ph:Math.random()*6}}\nfunction syncSprites(){while(spr.length<S.cr.length)spr.push(mkSprite(S.cr[spr.length]));}\nsyncSprites();\n\nfunction roll(egg){\n  const L=S.up.lucky,w=egg.w.map((v,i)=>v*(1+.15*L*i)),tot=w.reduce((a,b)=>a+b,0);\n  let r=Math.random()*tot,i=0;for(;i<4;i++){if(r<w[i])break;r-=w[i]}\n  return i;\n}\nfunction hatch(slot){\n  const egg=EGGS[S.nest[slot].t],r=roll(egg),k=Math.floor(Math.random()*SPECIES[r].length);\n  S.nest[slot]=null;S.cr.push([r,k]);syncSprites();\n  toast('Hatched a '+RAR[r]+' '+SPECIES[r][k][0]+' '+SPECIES[r][k][1]+'!');beep(500+r*120,.4);\n}\nfunction warm(i,amt){\n  const e=S.nest[i];if(!e)return;\n  e.w+=amt;if(e.w>=EGGS[e.t].need)hatch(i);\n}\n\nfunction renderNest(){\n  $('nest').innerHTML=S.nest.map((e,i)=>e\n   ?`<button class=\"slot\" data-act=\"warm\" data-i=\"${i}\"><span class=\"egg\" style=\"filter:${EGGS[e.t].f}\">🥚<\/span><span class=\"bar\"><i style=\"width:${Math.min(100,e.w/EGGS[e.t].need*100)}%\"><\/i><\/span><small>Tap to warm<\/small><\/button>`\n   :`<div class=\"slot empty\">Empty nest<small>Buy an egg below<\/small><\/div>`).join('');\n}\nfunction renderTab(){\n  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));\n  let h='';\n  if(tab==='shop')h=EGGS.map((g,i)=>`<div class=\"row\"><span class=\"egg\" style=\"filter:${g.f}\">🥚<\/span><div><b>${g.n}<\/b><small>${g.w.map((v,j)=>v?RAR[j]:'').filter(Boolean).join(' · ')} · ${g.need} warmth<\/small><\/div><button data-act=\"buy\" data-i=\"${i}\" class=\"${S.coins<g.cost?'no':''}\">🪙 ${fmt(g.cost)}<\/button><\/div>`).join('');\n  else if(tab==='up')h=UP.map((u,i)=>{const l=S.up[u.id],mx=l>=u.max;return `<div class=\"row\"><div><b>${u.n}<\/b> <small style=\"display:inline\">Lv ${l}<\/small><small>${u.d}<\/small><\/div><button data-act=\"up\" data-i=\"${i}\" class=\"${!mx&&S.coins<upCost(u,l)?'no':''}\">${mx?'MAX':'🪙 '+fmt(upCost(u,l))}<\/button><\/div>`}).join('');\n  else h='<div class=\"grid\">'+SPECIES.map((t,r)=>t.map((s,k)=>{const n=S.cr.filter(c=>c[0]===r&&c[1]===k).length;return `<div class=\"cell\" style=\"box-shadow:inset 0 0 0 2px ${n?RC[r]:'#ffffff22'}\">${n?s[0]:'❓'}<small>${n?s[1]+' x'+n:RAR[r]}<\/small><\/div>`}).join('')).join('')+'<\/div>';\n  $('tab').innerHTML=h;\n}\nfunction hud(){$('coins').textContent='🪙 '+fmt(S.coins);$('rate').textContent='+'+fmt(income())+' coins/sec · '+S.cr.length+' creatures'}\n\n$('panel').addEventListener('pointerdown',e=>{\n  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;\n  if(t.dataset.tab){tab=t.dataset.tab;renderTab();return}\n  const i=+t.dataset.i,a=t.dataset.act;\n  if(a==='warm'){warm(i,1+S.up.hands);renderNest()}\n  else if(a==='buy'){\n    const g=EGGS[i],s=S.nest.findIndex(x=>!x);\n    if(S.coins<g.cost)toast('Not enough coins');\n    else if(s<0)toast('All nests are full');\n    else{S.coins-=g.cost;S.nest[s]={t:i,w:0};beep(300,.15);renderNest()}\n  }else if(a==='up'){\n    const u=UP[i],l=S.up[u.id];\n    if(l>=u.max)return;\n    if(S.coins<upCost(u,l)){toast('Not enough coins');return}\n    S.coins-=upCost(u,l);S.up[u.id]++;beep(650,.25);\n    if(u.id==='slots')S.nest.push(null);\n    renderNest();\n  }\n  renderTab();hud();save();\n});\n$('reset').onclick=()=>{if(confirm('Reset your island and start over?')){S={coins:30,cr:[],up:{hands:0,cozy:0,slots:0,basket:0,lucky:0},nest:[{t:0,w:0}]};spr=[];renderNest();renderTab();hud();save()}};\n\n// canvas\nconst cv=$('c'),ctx=cv.getContext('2d');\nlet W=0,H=0,geo={};\nfunction fit(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);\n  const rx=Math.min(W*.44,H*1.1,340);geo={cx:W/2,cy:H*.52,rx,ry:rx*.42>H*.4?H*.4:rx*.42}}\naddEventListener('resize',fit);fit();\nconst scr=s=>({x:geo.cx+s.x*geo.rx*.78,y:geo.cy+s.y*geo.ry*.7});\ncv.addEventListener('pointerdown',e=>{\n  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n  let best=null,bd=40;\n  for(const s of spr){const p=scr(s),d=Math.hypot(p.x-x,p.y-y+10);if(d<bd&&s.cd<=0){bd=d;best=s}}\n  if(best){const g=INC[best.r]*4*(1+.25*S.up.basket);S.coins+=g;best.cd=6;const p=scr(best);pops.push({t:'+'+fmt(g),x:p.x,y:p.y-30,a:1});beep(900,.1);hud()}\n});\n\nlet last=performance.now(),acc=0,saveT=0,t=0;\nfunction frame(now){\n  const dt=Math.min(.1,(now-last)/1000);last=now;t+=dt;\n  S.coins+=income()*dt;\n  if(S.up.cozy)for(let i=0;i<S.nest.length;i++)if(S.nest[i]){warm(i,S.up.cozy*.6*dt)}\n  acc+=dt;if(acc>.2){acc=0;hud();renderNest();renderTab()}\n  saveT+=dt;if(saveT>5){saveT=0;save()}\n  // sprites\n  for(const s of spr){\n    s.cd=Math.max(0,s.cd-dt);s.wait-=dt;\n    if(s.wait<=0){s.tx=(Math.random()*2-1)*.85;s.ty=(Math.random()*2-1)*.8;s.wait=2+Math.random()*4}\n    const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy);\n    if(d>.02){s.x+=dx/d*.12*dt;s.y+=dy/d*.12*dt}\n  }\n  draw();\n  requestAnimationFrame(frame);\n}\nfunction draw(){\n  const {cx,cy,rx,ry}=geo;\n  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3ec6d8');g.addColorStop(1,'#0f7c99');\n  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;\n  for(let i=0;i<7;i++){const y=(H*(i+.5)/7),o=Math.sin(t*.8+i)*12;ctx.beginPath();ctx.moveTo(10+o,y);ctx.quadraticCurveTo(40+o,y-6,70+o,y);ctx.moveTo(W-90+o,y+18);ctx.quadraticCurveTo(W-60+o,y+12,W-30+o,y+18);ctx.stroke()}\n  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(cx,cy+6,rx*1.05,ry*1.08,0,0,6.283);ctx.fill();\n  ctx.fillStyle='#ffe8a3';ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,6.283);ctx.fill();\n  ctx.fillStyle='#7bd389';ctx.beginPath();ctx.ellipse(cx,cy-2,rx*.82,ry*.78,0,0,6.283);ctx.fill();\n  ctx.textAlign='center';ctx.textBaseline='middle';\n  const fs=Math.max(22,Math.min(36,rx*.11));\n  ctx.font=fs*1.2+'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  [[-.78,-.25],[.8,-.15],[-.3,.75],[.5,.78]].forEach(([a,b])=>ctx.fillText('🌴',cx+a*rx*.9,cy+b*ry*.9));\n  const order=[...spr].sort((a,b)=>a.y-b.y);\n  ctx.font=fs+'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  for(const s of order){\n    const p=scr(s),bob=Math.sin(t*4+s.ph)*2;\n    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(p.x,p.y+fs*.4,fs*.4,fs*.12,0,0,6.283);ctx.fill();\n    ctx.strokeStyle=RC[s.r];ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y+fs*.4,fs*.5,fs*.16,0,0,6.283);ctx.stroke();\n    ctx.fillStyle='#fff';ctx.fillText(s.e,p.x,p.y+bob);\n    if(s.cd<=0){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(p.x+fs*.45,p.y-fs*.5,5,0,6.283);ctx.fill();ctx.strokeStyle='#8a5a00';ctx.lineWidth=1.5;ctx.stroke()}\n  }\n  for(let i=pops.length-1;i>=0;i--){\n    const p=pops[i];p.y-=.6;p.a-=.016;if(p.a<=0){pops.splice(i,1);continue}\n    ctx.globalAlpha=p.a;ctx.fillStyle='#fff3d1';ctx.font='22px \"Paytone One\",system-ui,sans-serif';ctx.fillText(p.t+' 🪙',p.x,p.y);ctx.globalAlpha=1;\n  }\n  if(!spr.length){ctx.fillStyle='rgba(0,0,0,.45)';ctx.font='18px system-ui,sans-serif';ctx.fillText('Tap your egg below to hatch your first creature!',cx,cy)}\n}\nhud();renderNest();renderTab();\naddEventListener('pagehide',save);\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "orbit-keeper", "e": "🛰️", "t": "Orbit Keeper", "d": "Hop between three orbits to dodge rocks and grab stars.", "tag": "Arcade", "c": "#9fb4ff", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Orbit Keeper<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#070b1f;--ink:#e8f1ff;--cy:#3df5ff;--mg:#ff3da5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#070b1f}}\n:root[data-theme=\"dark\"]{--bg:#070b1f}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Orbitron',system-ui,sans-serif;overflow:hidden;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}\n#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:12px 18px;pointer-events:none;font-size:1.1rem}\n#score{font-size:1.8rem;color:var(--cy)}\n.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,11,31,.85);padding:16px}\n.ov.hide{display:none}\n.card{text-align:center;max-width:380px;border:2px solid var(--cy);border-radius:20px;padding:24px 28px;background:#0d1433;box-shadow:0 0 30px #3df5ff55}\nh1{margin:0 0 10px;font-size:2rem;color:var(--cy)}\np{font-family:system-ui,sans-serif;line-height:1.5;margin:6px 0 16px}\nbutton{font:inherit;font-size:1.1rem;color:#06122b;background:var(--cy);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}\nbutton:focus-visible{outline:3px solid #fff;outline-offset:3px}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Tap the left side to move inward, the right side to move outward\"><\/canvas>\n<div id=\"hud\"><div id=\"score\">0<\/div><div id=\"best\">Best 0<\/div><\/div>\n<div id=\"ov\" class=\"ov\"><div class=\"card\"><h1 id=\"t\">Orbit Keeper<\/h1><p id=\"d\">Your satellite circles the planet on its own. Tap the <b>left<\/b> side of the screen (or A / left arrow) to drop to an inner ring, the <b>right<\/b> side (or D / right arrow) to climb to an outer ring. Dodge the magenta rocks and grab the cyan stars.<\/p><button id=\"go\">Launch<\/button><\/div><\/div>\n<\script>\nconst $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');\nlet W=0,H=0,cx=0,cy=0,rings=[];\nfunction fit(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2;const b=Math.min(W,H)/2-22;rings=[b*.38,b*.66,b*.94]}\naddEventListener('resize',fit);fit();\nlet best=0;try{best=+localStorage.getItem('orbitBest')||0}catch(e){}\n$('best').textContent='Best '+best;\nlet ring,ringF,ang,things,trail,t,score,stars,spawn,starT,dead,run=false,stars2=[],ac=null;\nfor(let i=0;i<70;i++)stars2.push({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.3});\nfunction beep(f,d,ty){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.6,n+d);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}\nfunction start(
