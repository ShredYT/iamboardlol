){ring=1;ringF=1;ang=-Math.PI/2;things=[];trail=[];t=0;score=0;stars=0;spawn=1;starT=2;dead=false;run=true;$('ov').classList.add('hide');beep(400,.2)}\nfunction shift(d){if(!run)return;const n=Math.max(0,Math.min(2,ring+d));if(n!==ring){ring=n;beep(300+n*120,.08,'triangle')}}\ncv.addEventListener('pointerdown',e=>{if(!run)return;const r=cv.getBoundingClientRect();shift(e.clientX-r.left<W/2?-1:1)});\naddEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft'||k==='arrowdown'||k==='s')shift(-1);if(k==='d'||k==='arrowright'||k==='arrowup'||k==='w')shift(1);if((k===' '||k==='enter')&&!run&&e.target.tagName!=='BUTTON')start()});\n$('go').onclick=start;\nfunction pos(r,a){return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}}\nfunction over(){\n  run=false;dead=true;beep(120,.6,'sawtooth');\n  const s=Math.floor(score);if(s>best){best=s;try{localStorage.setItem('orbitBest',best)}catch(e){}}\n  $('best').textContent='Best '+best;\n  $('t').textContent='Signal lost';$('d').textContent='You scored '+s+' and grabbed '+stars+' stars. Best: '+best+'.';$('go').textContent='Launch again';$('ov').classList.remove('hide');$('go').focus();\n}\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.05,(now-last)/1000);last=now;\n  if(run){\n    t+=dt;const sp=1.3+Math.min(1.4,t*.02);\n    ang+=sp*dt;ringF+=(ring-ringF)*Math.min(1,dt*10);score+=dt*10;\n    const pr=rings[0]+(rings[1]-rings[0])*Math.min(1,ringF)+(rings[2]-rings[1])*Math.max(0,ringF-1),p=pos(pr,ang);\n    trail.push({x:p.x,y:p.y,a:1});if(trail.length>26)trail.shift();\n    spawn-=dt;starT-=dt;\n    if(spawn<=0){spawn=Math.max(.45,1.1-t*.01);const rg=Math.floor(Math.random()*3);things.push({k:'rock',rg,a:ang+Math.PI+(Math.random()-.5)*2,w:(Math.random()<.5?-1:1)*(.4+Math.random()*.8),s:.7+Math.random()*.6,ttl:14})}\n    if(starT<=0){starT=2.2+Math.random()*1.5;things.push({k:'star',rg:Math.floor(Math.random()*3),a:Math.random()*6.283,w:.3,s:1,ttl:9})}\n    for(let i=things.length-1;i>=0;i--){\n      const o=things[i];o.a+=o.w*dt;o.ttl-=dt;if(o.ttl<=0){things.splice(i,1);continue}\n      const q=pos(rings[o.rg],o.a),rad=o.k==='rock'?10*o.s:9;\n      if(Math.hypot(q.x-p.x,q.y-p.y)<rad+7){\n        if(o.k==='star'){stars++;score+=50;things.splice(i,1);beep(900,.15,'triangle')}else{over();break}\n      }\n    }\n  }\n  ctx.fillStyle='#070b1f';ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='#fff';for(const s of stars2){ctx.globalAlpha=.3+.5*Math.abs(Math.sin(now/900+s.x*9));ctx.fillRect(s.x*W,s.y*H,s.s,s.s)}\n  ctx.globalAlpha=1;\n  const pulse=1+Math.sin(now/500)*.04,g=ctx.createRadialGradient(cx,cy,4,cx,cy,rings[0]*.75*pulse);g.addColorStop(0,'#ffd27a');g.addColorStop(1,'#ff3da555');\n  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rings[0]*.6*pulse,0,6.283);ctx.fill();\n  ctx.lineWidth=2;\n  rings.forEach(r=>{ctx.strokeStyle='rgba(61,245,255,.22)';ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke()});\n  if(things)for(const o of things){\n    const q=pos(rings[o.rg],o.a);\n    if(o.k==='rock'){ctx.fillStyle='#ff3da5';ctx.shadowColor='#ff3da5';ctx.shadowBlur=14;ctx.beginPath();for(let i=0;i<7;i++){const a=i/7*6.283+o.a,r=(10+(i%2)*4)*o.s;ctx.lineTo(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r)}ctx.fill()}\n    else{ctx.fillStyle='#3df5ff';ctx.shadowColor='#3df5ff';ctx.shadowBlur=16;ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*6.283-1.57+o.a,r=i%2?4:10;ctx.lineTo(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r)}ctx.fill()}\n    ctx.shadowBlur=0;\n  }\n  if(trail&&run){\n    const pr=rings[0]+(rings[1]-rings[0])*Math.min(1,ringF)+(rings[2]-rings[1])*Math.max(0,ringF-1);\n    trail.forEach((q,i)=>{ctx.fillStyle=`rgba(255,255,255,${i/trail.length*.5})`;ctx.beginPath();ctx.arc(q.x,q.y,2+i/trail.length*3,0,6.283);ctx.fill()});\n    const p=pos(pr,ang);ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,7,0,6.283);ctx.fill();ctx.shadowBlur=0;\n  }\n  if(run)$('score').textContent=Math.floor(score);\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "laser-lab", "e": "🔦", "t": "Laser Lab", "d": "Flip mirrors to steer a laser into the target. Endless puzzles.", "tag": "Puzzle", "c": "#ff9b9b", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Laser Lab<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#0a1a1f;--ink:#e6fbff;--las:#ff3b5c;--mir:#7df9ff;--ok:#5dff9b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0a1a1f}}\n:root[data-theme=\"dark\"]{--bg:#0a1a1f}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;font-weight:600;overflow:hidden;display:flex;flex-direction:column}\n#hud{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:1.5rem}\n#hud span{color:var(--mir)}\nmain{flex:1;position:relative;min-height:0}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}\n#bar{display:flex;justify-content:center;gap:10px;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px))}\nbutton{font:inherit;font-size:1.2rem;color:#04181d;background:var(--mir);border:0;border-radius:12px;padding:10px 22px;cursor:pointer}\nbutton.alt{background:#1b3a43;color:var(--ink)}\nbutton:focus-visible{outline:3px solid #fff;outline-offset:2px}\n.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,18,22,.82);padding:16px;z-index:2}\n.ov.show{display:flex}\n.card{text-align:center;max-width:380px;background:#10303a;border:2px solid var(--mir);border-radius:18px;padding:22px 26px}\n.card h2{margin:0 0 8px;font-size:2.2rem;color:var(--ok)}\n.card p{margin:6px 0 16px;font-weight:500;font-size:1.15rem;line-height:1.4}\n<\/style>\n<\/head>\n<body>\n<div id=\"hud\"><div>Level <span id=\"lv\">1<\/span><\/div><div>Flips <span id=\"mv\">0<\/span><\/div><\/div>\n<main><canvas id=\"c\" aria-label=\"Puzzle board. Click mirrors to flip them and send the laser into the target.\"><\/canvas>\n<div id=\"ov\" class=\"ov show\"><div class=\"card\"><h2 id=\"t\" style=\"color:var(--mir)\">Laser Lab<\/h2><p id=\"d\">Click a mirror to flip it between / and \\. Steer the red laser into the glowing target. Puzzles get bigger and trickier as you go.<\/p><button id=\"go\">Start<\/button><\/div><\/div><\/main>\n<div id=\"bar\"><button class=\"alt\" id=\"shuf\">New puzzle<\/button><\/div>\n<\script>\nconst $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');\nlet W=0,H=0,N=5,grid=[],em,level=1,moves=0,solved=false,S=0,ox=0,oy=0,ac=null,flash=0;\nfunction fit(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H)-16;ox=(W-S)/2;oy=(H-S)/2}\naddEventListener('resize',fit);fit();\nconst inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;\nfunction beep(f,d,ty){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty||'triangle';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+d);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}\n\nfunction trace(){\n  let x=em.x,y=em.y,dx=em.dx,dy=em.dy,hit=false;const pts=[[x+.5,y+.5]];\n  for(let i=0;i<200;i++){\n    x+=dx;y+=dy;\n    if(!inb(x,y)||grid[y][x]==='#'){pts.push([x+.5-dx*.5,y+.5-dy*.5]);break}\n    const c=grid[y][x];\n    if(c==='T'){pts.push([x+.5,y+.5]);hit=true;break}\n    if(c==='/'){pts.push([x+.5,y+.5]);const a=-dy,b=-dx;dx=a;dy=b}\n    else if(c==='\\\\'){pts.push([x+.5,y+.5]);const a=dy,b=dx;dx=a;dy=b}\n  }\n  return{pts,hit};\n}\nfunction gen(){\n  N=Math.min(8,5+Math.floor((level-1)/3));\n  let turns=Math.min(6,2+Math.floor((level-1)/2)),att=0;\n  for(;;){\n    if(++att>300&&turns>2){turns--;att=0}\n    const g=Array.from({length:N},()=>Array(N).fill('.'));\n    const y0=Math.floor(Math.random()*N),used=new Set();\n    let x=0,y=y0,dx=1,dy=0,ok=true;const pm=[];used.add(x+','+y);\n    for(let t=0;t<=turns&&ok;t++){\n      const k=1+Math.floor(Math.random()*(N-1));\n      for(let i=0;i<k;i++){x+=dx;y+=dy;const key=x+','+y;if(!inb(x,y)||used.has(key)){ok=false;break}used.add(key)}\n      if(!ok)break;\n      if(t===turns){g[y][x]='T';break}\n      const cw=Math.random()<.5,ndx=cw?-dy:dy,ndy=cw?dx:-dx;\n      g[y][x]=(ndx===-dy&&ndy===-dx)?'/':'\\\\';pm.push([x,y]);dx=ndx;dy=ndy;\n    }\n    if(!ok)continue;\n    for(const[mx,my]of pm)g[my][mx]=Math.random()<.5?'/':'\\\\';\n    const free=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(!used.has(i+','+j))free.push([i,j]);\n    free.sort(()=>Math.random()-.5);\n    const nw=Math.floor(N*.7);\n    free.slice(0,nw).forEach(([i,j])=>g[j][i]='#');\n    free.slice(nw,nw+2).forEach(([i,j])=>g[j][i]=Math.random()<.5?'/':'\\\\');\n    grid=g;em={x:0,y:y0,dx:1,dy:0};\n    if(trace().hit){const[mx,my]=pm[0];grid[my][mx]=grid[my][mx]==='/'?'\\\\':'/'}\n    return;\n  }\n}\nfunction newPuzzle(){gen();moves=0;solved=false;$('lv').textContent=level;$('mv').textContent=0}\ncv.addEventListener('pointerdown',e=>{\n  if(solved||$('ov').classList.contains('show'))return;\n  const r=cv.getBoundingClientRect(),c=S/N,x=Math.floor((e.clientX-r.left-ox)/c),y=Math.floor((e.clientY-r.top-oy)/c);\n  if(!inb(x,y))return;\n  const v=grid[y][x];\n  if(v==='/'||v==='\\\\'){\n    grid[y][x]=v==='/'?'\\\\':'/';moves++;$('mv').textContent=moves;beep(500+Math.random()*200,.08);\n    if(trace().hit){solved=true;flash=1;beep(880,.4);setTimeout(()=>{$('t').textContent='Level '+level+' solved!';$('d').textContent='Done in '+moves+' flips.';$('go').textContent='Next level';$('ov').classList.add('show');$('go').focus()},650)}\n  }\n});\n$('go').onclick=()=>{if(solved)level++;newPuzzle();$('ov').classList.remove('show');$('t').style.color='var(--ok)'};\n$('shuf').onclick=()=>{if(!$('ov').classList.contains('show'))newPuzzle()};\nnewPuzzle();\n\nfunction frame(now){\n  ctx.clearRect(0,0,W,H);\n  const c=S/N,res=trace();\n  ctx.fillStyle='#0f2a31';ctx.beginPath();ctx.roundRect(ox-6,oy-6,S+12,S+12,14);ctx.fill();\n  for(let j=0;j<N;j++)for(let i=0;i<N;i++){\n    const x=ox+i*c,y=oy+j*c,v=grid[j][i];\n    ctx.fillStyle=(i+j)%2?'#12343c':'#153a43';ctx.fillRect(x,y,c,c);\n    if(v==='#'){ctx.fillStyle='#3b4a52';ctx.fillRect(x+3,y+3,c-6,c-6);ctx.fillStyle='#4a5c65';ctx.fillRect(x+3,y+3,c-6,(c-6)*.3)}\n  }\n  // emitter\n  {const x=ox+em.x*c,y=oy+em.y*c;ctx.fillStyle='#ff3b5c';ctx.beginPath();ctx.roundRect(x+c*.12,y+c*.22,c*.5,c*.56,6);ctx.fill();ctx.fillStyle='#ffd0d8';ctx.beginPath();ctx.moveTo(x+c*.6,y+c*.3);ctx.lineTo(x+c*.9,y+c*.5);ctx.lineTo(x+c*.6,y+c*.7);ctx.fill()}\n  // beam\n  ctx.lineJoin='round';ctx.lineCap='round';\n  const col=res.hit?'#5dff9b':'#ff3b5c';\n  ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.lineWidth=Math.max(3,c*.09);\n  ctx.beginPath();res.pts.forEach((p,k)=>{const X=ox+p[0]*c,Y=oy+p[1]*c;k?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();\n  ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,c*.03);\n  ctx.beginPath();res.pts.forEach((p,k)=>{const X=ox+p[0]*c,Y=oy+p[1]*c;k?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();\n  // mirrors and target\n  for(let j=0;j<N;j++)for(let i=0;i<N;i++){\n    const x=ox+i*c,y=oy+j*c,v=grid[j][i],m=c*.16;\n    if(v==='/'||v==='\\\\'){\n      ctx.strokeStyle='#7df9ff';ctx.shadowColor='#7df9ff';ctx.shadowBlur=10;ctx.lineWidth=Math.max(5,c*.11);\n      ctx.beginPath();if(v==='/'){ctx.moveTo(x+m,y+c-m);ctx.lineTo(x+c-m,y+m)}else{ctx.moveTo(x+m,y+m);ctx.lineTo(x+c-m,y+c-m)}ctx.stroke();ctx.shadowBlur=0;\n    }else if(v==='T'){\n      const cx=x+c/2,cy=y+c/2,lit=res.hit,p=1+Math.sin(now/260)*.06;\n      ctx.fillStyle=lit?'#5dff9b':'#ffb703';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=lit?26:12;\n      ctx.beginPath();ctx.arc(cx,cy,c*.36*p,0,6.283);ctx.fill();ctx.shadowBlur=0;\n      ctx.fillStyle='#0a1a1f';ctx.beginPath();ctx.arc(cx,cy,c*.22,0,6.283);ctx.fill();\n      ctx.fillStyle=lit?'#5dff9b':'#ffb703';ctx.beginPath();ctx.arc(cx,cy,c*.1,0,6.283);ctx.fill();\n    }\n  }\n  if(flash>0){ctx.fillStyle=`rgba(93,255,155,${flash*.25})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-.02)}\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "turbo-bot", "e": "🤖", "t": "Turbo Bot", "d": "Double-jump a runaway robot over spikes, crates and pits.", "tag": "Arcade", "c": "#c9a2ff", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Turbo Bot<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#2b1055;--ink:#fff1d6;--hot:#ffb703;--cy:#5ef2e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#2b1055}}\n:root[data-theme=\"dark\"]{--bg:#2b1055}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P','Courier New',monospace;overflow:hidden;position:relative}\ncanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}\n#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:14px 16px;font-size:.8rem;pointer-events:none;text-shadow:2px 2px #000}\n#hud b{color:var(--hot)}\n.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,10,60,.78);padding:16px}\n.ov.hide{display:none}\n.card{text-align:center;max-width:420px;background:#3c1a78;border:4px solid var(--hot);padding:24px 22px;line-height:1.7;font-size:.72rem}\nh1{font-size:1.5rem;margin:0 0 14px;color:var(--hot);font-weight:400;line-height:1.3}\nbutton{font:inherit;font-size:.85rem;color:#2b1055;background:var(--hot);border:0;padding:14px 22px;cursor:pointer;margin-top:10px}\nbutton:focus-visible{outline:3px solid #fff;outline-offset:3px}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Tap or press space to jump. Tap again in the air to double jump.\"><\/canvas>\n<div id=\"hud\"><div>Score <b id=\"sc\">0<\/b><\/div><div>Bolts <b id=\"bo\">0<\/b><\/div><div>Best <b id=\"be\">0<\/b><\/div><\/div>\n<div id=\"ov\" class=\"ov\"><div class=\"card\"><h1 id=\"t\">Turbo Bot<\/h1><div id=\"d\">Tap, click, or press SPACE to jump. Jump again in mid-air to double jump. Hop spikes, crates and pits, and grab the bolts.<\/div><button id=\"go\">Run!<\/button><\/div><\/div>\n<\script>\nconst $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');\nlet W=0,H=0,gy=0;\nfunction fit(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);gy=Math.round(H*.76)}\naddEventListener('resize',fit);fit();\nlet best=0;try{best=+localStorage.getItem('botBest')||0}catch(e){}\n$('be').textContent=best;\nlet run=false,bot,obs,bolts,dist,bt,v,t,sp,ac=null,parts=[];\nconst bx=()=>Math.max(60,W*.2);\nconst skyline=[];for(let i=0;i<40;i++)skyline.push({w:40+Math.random()*60,h:40+Math.random()*130});\nfunction beep(f,d,ty){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.6,n+d);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}\nfunction start(){bot={y:gy,vy:0,on:true,dj:1};obs=[];bolts=[];dist=0;bt=0;v=330;t=0;parts=[];run=true;$('ov').classList.add('hide');beep(400,.15)}\nfunction jump(){\n  if(!run)return;\n  if(bot.on){bot.vy=-830;bot.on=false;bot.dj=1;beep(500,.12)}\n  else if(bot.dj>0){bot.dj--;bot.vy=-760;beep(700,.12);for(let i=0;i<6;i++)parts.push({x:bx(),y:bot.y,vx:(Math.random()-.5)*120,vy:Math.random()*80,a:1})}\n}\ncv.addEventListener('pointerdown',jump);\naddEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.key==='w'){e.preventDefault();if(e.target.tagName!=='BUTTON'){run?jump():start()}}});\n$('go').onclick=start;\nfunction spawn(){\n  const k=Math.random(),x=W+60;let o;\n  if(k<.35)o={k:'spike',x,w:30,h:30};\n  else if(k<.65)o={k:'crate',x,w:40,h:38+Math.floor(Math.random()*3)*14};\n  else o={k:'pit',x,w:90+Math.random()*50+v*.08,h:0};\n  obs.push(o);\n  const cx=x+o.w/2;\n  for(let i=0;i<3;i++){const a=i/2;bolts.push({x:cx-40+i*40,y:gy-90-Math.sin(a*Math.PI)*60-(o.h||0)*.4})}\n}\nfunction die(){\n  run=false;beep(150,.5,'sawtooth');\n  const s=Math.floor(dist/20)+bt*10;if(s>best){best=s;try{localStorage.setItem('botBest',best)}catch(e){}}\n  $('be').textContent=best;$('t').textContent='Crashed!';$('d').innerHTML='Score '+s+'<br>Bolts '+bt+'<br>Best '+best;$('go').textContent='Run again';$('ov').classList.remove('hide');$('go').focus();\n}\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(.04,(now-last)/1000);last=now;\n  if(run){\n    t+=dt;v=Math.min(720,330+t*9);dist+=v*dt;\n    const X=bx(),pitUnder=obs.some(o=>o.k==='pit'&&X>o.x+6&&X<o.x+o.w-6);\n    bot.vy+=2300*dt;bot.y+=bot.vy*dt;\n    if(pitUnder){bot.on=false;if(bot.y>gy+H*.4){die()}}\n    else if(bot.y>=gy){bot.y=gy;bot.vy=0;if(!bot.on){bot.on=true;bot.dj=1}}\n    for(const o of obs)o.x-=v*dt;\n    for(const b of bolts)b.x-=v*dt;\n    obs=obs.filter(o=>o.x+o.w>-40);bolts=bolts.filter(b=>b.x>-30);\n    const rm=obs.length?obs[obs.length-1].x:-999;\n    if(rm<W-(260+v*.45+Math.random()*120))spawn();\n    const r={x:X-13,y:bot.y-42,w:26,h:40};\n    for(const o of obs){\n      if(o.k==='pit')continue;\n      const q=o.k==='spike'?{x:o.x+5,y:gy-o.h+8,w:o.w-10,h:o.h-8}:{x:o.x+2,y:gy-o.h,w:o.w-4,h:o.h};\n      if(r.x<q.x+q.w&&r.x+r.w>q.x&&r.y<q.y+q.h&&r.y+r.h>q.y){die();break}\n    }\n    for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];if(Math.hypot(b.x-X,b.y-(bot.y-22))<24){bolts.splice(i,1);bt++;beep(1000,.08,'triangle')}}\n    $('sc').textContent=Math.floor(dist/20)+bt*10;$('bo').textContent=bt;\n  }\n  // draw\n  const g=ctx.createLinearGradient(0,0,0,gy);g.addColorStop(0,'#2b1055');g.addColorStop(.6,'#d8416f');g.addColorStop(1,'#ffb703');\n  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='#ffe29a';ctx.beginPath();ctx.arc(W*.75,gy*.6,Math.min(60,W*.12),0,6.283);ctx.fill();\n  const sh=(dist||0)*.25;let xx=-(sh%1200);ctx.fillStyle='#3a1666';\n  for(let i=0;xx<W+100;i++){const b=skyline[i%40];ctx.fillRect(xx,gy-b.h,b.w,b.h);xx+=b.w+8}\n  ctx.fillStyle='#1a0a38';ctx.fillRect(0,gy,W,H-gy);\n  if(obs){\n    ctx.fillStyle='#2b1055';\n    for(const o of obs)if(o.k==='pit')ctx.fillRect(o.x,gy,o.w,H-gy);\n    ctx.fillStyle='#7a3dd8';const off=(dist||0)%40;for(let x=-off;x<W;x+=40)ctx.fillRect(x,gy,20,4);\n    for(const o of obs){\n      if(o.k==='spike'){ctx.fillStyle='#ff5d73';ctx.beginPath();ctx.moveTo(o.x,gy);ctx.lineTo(o.x+o.w/2,gy-o.h);ctx.lineTo(o.x+o.w,gy);ctx.fill()}\n      else if(o.k==='crate'){ctx.fillStyle='#ff9e2c';ctx.fillRect(o.x,gy-o.h,o.w,o.h);ctx.strokeStyle='#8a4a00';ctx.lineWidth=3;ctx.strokeRect(o.x+2,gy-o.h+2,o.w-4,o.h-4);ctx.beginPath();ctx.moveTo(o.x+2,gy-o.h+2);ctx.lineTo(o.x+o.w-2,gy-2);ctx.stroke()}\n    }\n    for(const b of bolts){ctx.fillStyle='#5ef2e0';ctx.shadowColor='#5ef2e0';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(b.x+3,b.y-10);ctx.lineTo(b.x-7,b.y+2);ctx.lineTo(b.x-1,b.y+2);ctx.lineTo(b.x-4,b.y+11);ctx.lineTo(b.x+7,b.y-2);ctx.lineTo(b.x+1,b.y-2);ctx.fill();ctx.shadowBlur=0}\n  }\n  if(bot){\n    const X=bx(),Y=Math.min(bot.y,gy+H),air=!bot.on,ph=Math.floor(now/90)%2;\n    ctx.save();ctx.translate(X,Y);\n    if(!run&&Y>gy+10)ctx.globalAlpha=.5;\n    ctx.fillStyle='#5ef2e0';ctx.fillRect(-13,-40,26,26);\n    ctx.fillStyle='#2b1055';ctx.fillRect(-2,-34,13,10);ctx.fillStyle='#ffb703';ctx.fillRect(3,-32,6,6);\n    ctx.fillStyle='#5ef2e0';ctx.fillRect(-2,-46,4,6);\n    ctx.fillStyle='#b9fff6';ctx.fillRect(-13,-14,26,6);\n    ctx.fillStyle='#ffb703';\n    if(air||!run){ctx.fillRect(-12,-8,8,8);ctx.fillRect(4,-8,8,8);ctx.fillStyle='#ff5d73';ctx.fillRect(-10,0,6,8+Math.random()*6)}\n    else if(ph){ctx.fillRect(-12,-8,8,8);ctx.fillRect(4,-12,8,8)}else{ctx.fillRect(-12,-12,8,8);ctx.fillRect(4,-8,8,8)}\n    ctx.restore();\n  }\n  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*3;if(p.a<=0){parts.splice(i,1);continue}ctx.fillStyle=`rgba(255,255,255,${p.a})`;ctx.fillRect(p.x,p.y,5,5)}\n  requestAnimationFrame(frame);\n}\nfit();requestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>\n"}];
const $=id=>document.getElementById(id);
$('logo').innerHTML=[...'IAmBoard.lol'].map((c,i)=>`<span style="animation-delay:${i*60}ms">${c}</span>`).join('');
$('grid').innerHTML=GAMES.map(g=>`<button class="card" data-id="${g.id}" style="background:${g.c}"><span class="e">${g.e}</span><h2 class="bungee">${g.t}</h2><p>${g.d}</p><span class="t">${g.tag}</span></button>`).join('');
let cur=null;
function open(id,fromHash){
  const g=GAMES.find(x=>x.id===id);if(!g)return;
  cur=g;$('ptitle').textContent=g.e+' '+g.t;
  const f=$('f');f.srcdoc=g.html;
  $('player').classList.add('on');document.body.style.overflow='hidden';
  f.onload=()=>{try{f.focus();f.contentWindow.focus()}catch(e){}};
  if(!fromHash)history.pushState(null,'','#'+id);
  document.title=g.t+' · IAmBoard.lol';
}
function close(fromHash){
  $('player').classList.remove('on');$('f').srcdoc='';cur=null;document.body.style.overflow='';
  document.title='IAmBoard.lol';
  if(!fromHash&&location.hash)history.pushState(null,'',location.pathname+location.search);
}
$('grid').onclick=e=>{const b=e.target.closest('.card');if(b)open(b.dataset.id)};
$('rnd').onclick=()=>open(GAMES[Math.floor(Math.random()*GAMES.length)].id);
$('back').onclick=()=>close();
$('redo').onclick=()=>{if(cur){const f=$('f');f.srcdoc='';setTimeout(()=>{f.srcdoc=cur.html},30)}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)close()});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);id?open(id,true):close(true)});
if(location.hash)open(location.hash.slice(1),true);
</script>
